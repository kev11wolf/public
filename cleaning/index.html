<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Home Clean" />
<meta name="theme-color" content="#0b0f1a" />
<title>Nightly Cleaning Schedule</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1>Nightly Cleaning</h1>
    <button id="namesBtn" class="icon-btn" aria-label="Edit names">⚙️ Names</button>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-view="today">Today</button>
    <button class="tab-btn" data-view="week">Week</button>
    <button class="tab-btn" data-view="month">Month</button>
  </nav>

  <main id="views">

    <section id="view-today" class="view active"></section>
    <section id="view-week" class="view"></section>
    <section id="view-month" class="view"></section>

  </main>
</div>

<div id="namesModal" class="modal hidden">
  <div class="modal-card">
    <h2>Your Names</h2>
    <label>Person 1
      <input id="input-personA" type="text" placeholder="e.g. Kevin" />
    </label>
    <label>Person 2
      <input id="input-personB" type="text" placeholder="e.g. Wife" />
    </label>
    <div class="modal-actions">
      <button id="namesCancel" class="btn ghost">Cancel</button>
      <button id="namesSave" class="btn primary">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
