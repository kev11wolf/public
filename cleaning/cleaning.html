<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Home Clean" />
<meta name="theme-color" content="#0b0f1a" />
<title>Nightly Cleaning Schedule</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1>Kevin &amp; Daisy's Cleaning</h1>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-view="today">Today</button>
    <button class="tab-btn" data-view="week">Week</button>
    <button class="tab-btn" data-view="month">Month</button>
  </nav>

  <main id="views">

    <section id="view-today" class="view active"></section>
    <section id="view-week" class="view"></section>
    <section id="view-month" class="view"></section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
