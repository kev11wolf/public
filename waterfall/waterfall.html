<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="North Carolina waterfalls, overlooks, and scenic points of interest.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NC Waterfalls">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="app-icon.svg">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <title>NC Waterfalls & Scenic Map</title>
  <style>
    :root{--ink:#10231e;--pine:#173f35;--moss:#2f6b56;--cream:#f7f5ef;--line:#d9e1dc;--muted:#587067;--orange:#e87536;--blue:#23729d;--top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.leaflet-popup-content-wrapper{border-radius:16px}.leaflet-popup-content{margin:14px;min-width:230px}.leaflet-container a{color:#155743;font-weight:700}.app{position:fixed;z-index:500;inset:0;pointer-events:none}.topbar,.sheet,.locate{pointer-events:auto}.topbar{position:absolute;top:calc(var(--top) + 10px);left:10px;right:10px;display:flex;gap:8px}.title{background:var(--pine);color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 12px #10231e52;white-space:nowrap}.title b{display:block;font-size:14px}.title small{display:block;font-size:11px;opacity:.82}.search{flex:1;position:relative}.search input{width:100%;height:100%;min-height:48px;border:0;border-radius:16px;padding:0 41px 0 13px;background:#fff;box-shadow:0 3px 12px #10231e52;font-size:16px;outline:0}.search button{position:absolute;right:6px;top:7px;border:0;border-radius:10px;background:#edf4f1;color:var(--pine);width:34px;height:34px;font-size:20px}.sheet{position:absolute;bottom:0;left:0;right:0;max-height:42vh;overflow:auto;background:var(--cream);box-shadow:0 -5px 24px #10231e3b;border-radius:24px 24px 0 0;padding:10px 13px calc(13px + var(--bottom))}.grab{height:4px;width:43px;border-radius:3px;background:#bdc9c3;margin:0 auto 10px}.tools,.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.tools{padding-bottom:9px}.filters{padding-bottom:9px}.tools::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.button,.chip{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);white-space:nowrap;padding:8px 11px;font-size:13px;font-weight:700}.button.primary,.chip.active{background:var(--pine);border-color:var(--pine);color:#fff}.button.loading{opacity:.65;pointer-events:none}.summary{font-size:12px;line-height:1.35;color:var(--muted);margin:0 0 8px}.list{display:grid;gap:7px}.place{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:9px;display:grid;grid-template-columns:34px 1fr auto;gap:9px;text-align:left;align-items:center}.place-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#eaf2ee;font-size:17px}.place b{font-size:14px;display:block}.place small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.arrow{font-size:20px;color:var(--moss)}.locate{position:absolute;right:12px;bottom:calc(295px + var(--bottom));width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:var(--pine);box-shadow:0 3px 12px #10231e52;font-size:21px}.marker{width:34px;height:34px;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px #163b3266;background:var(--moss);display:grid;place-items:center}.marker.waterfall{background:var(--blue)}.marker.view{background:#a35f20}.marker.family{background:#5a7d28}.marker.camp{background:#7656a6}.marker.town{background:#b65344}.marker span{transform:rotate(45deg);font-size:15px}.popup-title{font-size:16px;margin:0 0 4px}.popup-meta{font-size:12px;color:var(--muted);margin-bottom:9px}.popup-note{font-size:13px;line-height:1.35;margin:0 0 11px}.popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.popup-actions a{border-radius:9px;padding:9px 7px;text-align:center;text-decoration:none;background:#eaf2ee;font-size:12px}.popup-actions .apple{background:var(--pine);color:#fff}.notice{position:absolute;left:50%;top:calc(var(--top) + 70px);transform:translateX(-50%);opacity:0;pointer-events:none;background:#10231eea;color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;white-space:nowrap;transition:opacity .2s}.notice.show{opacity:1}.empty{color:var(--muted);padding:20px;text-align:center}.sr{position:absolute;left:-9999px}@media(min-width:800px){.topbar{left:22px;right:auto;width:600px}.sheet{left:22px;bottom:22px;width:410px;max-height:68vh;border-radius:24px;padding-bottom:13px}.locate{right:22px;bottom:25px}.list{max-height:370px;overflow:auto;padding-right:2px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main id="map" aria-label="Interactive map of North Carolina waterfalls and scenic points of interest"></main>
  <div class="app">
    <header class="topbar"><div class="title"><b>NC Explore</b><small>Falls, views & easy stops</small></div><label class="search"><span class="sr">Search places</span><input id="search" type="search" autocomplete="off" placeholder="Search places, regions, features…"><button id="clear" aria-label="Clear search">×</button></label></header>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <button id="locate" class="locate" aria-label="Find my location" title="Find my location">◎</button>
    <section class="sheet" aria-label="Map filters and places"><div class="grab"></div><div class="tools"><button id="loadOSM" class="button primary">＋ Load OSM waterfalls & views</button><button id="resetMap" class="button">Reset NC map</button></div><div id="filters" class="filters"></div><p id="summary" class="summary"></p><div id="list" class="list"></div></section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (() => {
    'use strict';
    /* Curated, family-oriented anchors. The button below adds current OSM-mapped
       waterfalls and viewpoints statewide, then saves that response for 7 days. */
    const POIS = [
      ['Looking Glass Falls','waterfall','💧',35.2965,-82.7647,'Pisgah Forest','Roadside view + optional stairs',1,'A high-payoff roadside waterfall on US 276.'],
      ['Moore Cove Falls','waterfall','💧',35.3168,-82.7738,'Pisgah Forest','1.4 mi round trip',1,'Shaded waterfall walk; a carrier is more practical than a stroller.'],
      ['Sliding Rock','waterfall','💧',35.2956,-82.7660,'Pisgah Forest','Roadside viewing',0,'Natural slide and waterfall; swimming operation is seasonal.'],
      ['Pink Beds','family','🌿',35.3002,-82.8080,'Pisgah Forest','Flat, flexible forest stroll',1,'Picnic area and flat valley trails; turn around whenever the family is ready.'],
      ['Cradle of Forestry','family','🏛️',35.3327,-82.7885,'Pisgah Forest','Historic site + short walks',0,'Check seasonal opening hours and pet rules before departure.'],
      ["Devil’s Courthouse",'view','⛰️',35.3480,-82.9248,'Blue Ridge Parkway','Short but steep paved trail',1,'Huge views from an exposed summit. Best on a clear, calm day.'],
      ['Graveyard Fields','waterfall','💧',35.3002,-82.8790,'Blue Ridge Parkway','Boardwalks + waterfall trails',1,'High-elevation valley with short and longer options; can be muddy.'],
      ['Black Balsam Knob','view','⛰️',35.3367,-82.8784,'Blue Ridge Parkway','Exposed mountain walk',1,'Open bald scenery; use only in favorable weather with a toddler.'],
      ['Davidson River Campground','camp','⛺',35.2786,-82.7565,'Pisgah Forest','Developed campground',1,'A practical base for the US 276 waterfall corridor.'],
      ['Brevard','town','🍂',35.2334,-82.7343,'Transylvania County','Food, shops and parks',1,'A relaxed base town after forest sightseeing.'],
      ['Hooker Falls','waterfall','💧',35.1832,-82.6238,'DuPont Forest','0.8 mi round trip',1,'Short, straightforward waterfall walk; keep dogs leashed.'],
      ['Triple Falls','waterfall','💧',35.1791,-82.6249,'DuPont Forest','About 2.2 mi round trip',1,'Three cascades reached from the DuPont trail system.'],
      ['High Falls','waterfall','💧',35.1874,-82.6208,'DuPont Forest','About 2.2 mi round trip',1,'Large falls viewed from overlooks; combine only if the day is going well.'],
      ['Lake Julia','family','🛶',35.1937,-82.6190,'DuPont Forest','Short lake stroll',1,'A calm, picnic-friendly reset between waterfall stops.'],
      ['NC Arboretum','family','🌳',35.4858,-82.6118,'Asheville','Easy, flexible trails',1,'Managed gardens and trails; check current admission and garden pet rules.'],
      ['Jump Off Rock','view','🌄',35.3121,-82.4659,'Hendersonville','Drive-up overlook',1,'Very low-effort valley views near Hendersonville.'],
      ['Catawba Falls','waterfall','💧',35.6923,-82.2924,'Old Fort','About 2.5 mi round trip',1,'Forest waterfall hike with a substantial payoff; check trail status.'],
      ['Mount Mitchell State Park','view','🏔️',35.7649,-82.2651,'Black Mountain','Drive-up summit area',1,'Highest-elevation scenery in the East; confirm park and road access.'],
      ['Linville Falls','waterfall','💧',35.9590,-81.9366,'Blue Ridge Parkway','Several overlook options',1,'Classic multi-tier waterfall; verify Parkway and trail access.'],
      ['Grandfather Mountain','view','🌉',36.0959,-81.8126,'Linville','Drive-up mountain attraction',1,'Mile-high views and the Swinging Bridge; advance reservations may be needed.'],
      ['Moses H. Cone Manor','view','🏡',36.1526,-81.7030,'Blowing Rock','Carriage-road strolls',1,'Gentle carriage roads and a historic estate landscape.'],
      ['Gorges State Park','waterfall','💧',35.0691,-82.9516,'Sapphire','Waterfalls + overlooks',1,'Wild southern-mountain scenery with short and longer walking choices.'],
      ['Whitewater Falls','waterfall','💧',35.0218,-82.9936,'Sapphire','Short overlook walk',1,'Large waterfall with a relatively short approach; bring the carrier for stairs.'],
      ['Dry Falls','waterfall','💧',35.0687,-83.2368,'Highlands','Short paved trail + stairs',1,'Dramatic roadside waterfall where visitors can walk behind the falling water.'],
      ['Bridal Veil Falls','waterfall','💧',35.0844,-83.2424,'Highlands','Roadside viewing',1,'Easy waterfall stop on the US 64 scenic route.'],
      ['Lower Cullasaja Falls','waterfall','💧',35.0964,-83.2904,'Cullasaja Gorge','Roadside pull-off',1,'Visible from the road; use extreme care around traffic and wet rock.'],
      ['Mingo Falls','waterfall','💧',35.5389,-83.2892,'Cherokee','Short stairs',1,'Tall waterfall near Cherokee; expect many steps.'],
      ['Soco Falls','waterfall','💧',35.4724,-83.0840,'Maggie Valley','Short, steep access',1,'Double waterfall viewpoint close to the Blue Ridge Parkway corridor.'],
      ['Nantahala Falls','waterfall','💧',35.1786,-83.5927,'Nantahala Gorge','Roadside viewing',1,'Roadside river waterfall in a scenic gorge.'],
      ['Hanging Rock State Park','view','🪨',36.3903,-80.2647,'Danbury','Falls, lake and overlooks',1,'Piedmont mountain scenery with several waterfalls; check park conditions.'],
      ['Pilot Mountain State Park','view','⛰️',36.3449,-80.4695,'Pinnacle','Drive-up views + short walks',1,'Distinctive Sauratown Mountain landmark with scenic overlooks.'],
      ['Elk Knob State Park','view','🌲',36.3325,-81.6942,'Todd','Mountain summit trails',1,'High-country state park; check trail difficulty before taking a toddler.'],
      ['Jockey’s Ridge State Park','view','🏜️',35.9713,-75.6335,'Nags Head','Dunes + sound views',1,'Coastal scenery and open space, especially good near sunset.'],
      ['Cape Hatteras Lighthouse','view','🗼',35.5810,-75.4664,'Buxton','Iconic coastal landmark',1,'A landmark scenic stop; check climbing and pet rules seasonally.'],
      ['Chimney Rock State Park','view','🪨',35.4328,-82.2509,'Hickory Nut Gorge','Scenic attraction',0,'Iconic rock and gorge views; verify access, ticketing, and pet rules.']
    ].map(([n,c,e,lat,lng,r,kid,dog,note])=>({n,c,e,lat,lng,r,kid,dog:!!dog,note,source:'Curated'}));
    const CAT={all:['All','✦'],waterfall:['Waterfalls','💧'],view:['Views','⛰️'],family:['Easy & family','🌿'],camp:['Camping','⛺'],town:['Towns & food','🍂'],osm:['OSM live data','◌']};
    const state={filter:'all',query:'',markers:[],osm:[],osmLoaded:false};
    const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([35.46,-80.7],7);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const curatedLayer=L.layerGroup().addTo(map),osmLayer=L.layerGroup().addTo(map);
    const $=s=>document.querySelector(s),list=$('#list'),filters=$('#filters'),summary=$('#summary'),search=$('#search'),notice=$('#notice');
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const appleURL=p=>`https://maps.apple.com/?daddr=${encodeURIComponent(p.lat+','+p.lng)}&dirflg=d`;
    function toast(text){notice.textContent=text;notice.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>notice.classList.remove('show'),3100)}
    function markerIcon(p){return L.divIcon({className:'',html:`<div class="marker ${p.c}"><span>${p.e}</span></div>`,iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-35]})}
    function popup(p){return `<h2 class="popup-title">${esc(p.n)}</h2><div class="popup-meta">${esc(p.r)} · ${p.dog?'🐕 Leashed dogs: verify locally':'🐕 Check pet policy'} · ${esc(p.source||'Map data')}</div><p class="popup-note">${esc(p.note||'OpenStreetMap-mapped scenic location. Confirm access and conditions before leaving.')}</p><div class="popup-actions"><a class="apple apple-route" data-lat="${p.lat}" data-lng="${p.lng}" href="${appleURL(p)}">Route in Apple Maps</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(p.n+' current conditions')}">Check status</a></div>`}
    function isShown(p){const text=`${p.n} ${p.r} ${p.kid||''} ${p.note||''}`.toLowerCase();return (state.filter==='all'||(state.filter==='osm'&&p.source==='OpenStreetMap')||p.c===state.filter)&&text.includes(state.query.toLowerCase())}
    function focus(p){map.flyTo([p.lat,p.lng],14,{duration:matchMedia('(prefers-reduced-motion:reduce)').matches?0:.65});setTimeout(()=>state.markers.find(x=>x.p===p)?.m.openPopup(),360)}
    function draw(){curatedLayer.clearLayers();osmLayer.clearLayers();state.markers=[];const all=[...POIS,...state.osm].filter(isShown);all.forEach(p=>{let m;if(p.source==='OpenStreetMap'){m=L.circleMarker([p.lat,p.lng],{renderer:L.canvas(),radius:6,color:'#fff',weight:1.5,fillColor:p.c==='waterfall'?'#23729d':'#a35f20',fillOpacity:.95})}else{m=L.marker([p.lat,p.lng],{icon:markerIcon(p),title:p.n,keyboard:true})}m.bindPopup(popup(p),{maxWidth:300});m.addTo(p.source==='OpenStreetMap'?osmLayer:curatedLayer);state.markers.push({p,m})});summary.textContent=`${all.length} places shown${state.osmLoaded?` · ${state.osm.length} loaded from OpenStreetMap`:''}. Tap a place for its menu.`;const listItems=all.filter(p=>p.source!=='OpenStreetMap').slice(0,100);list.innerHTML=listItems.length?listItems.map(p=>`<button class="place" data-name="${esc(p.n)}"><span class="place-icon">${p.e}</span><span><b>${esc(p.n)}</b><small>${esc(p.r)} · ${esc(p.kid)}</small></span><span class="arrow">›</span></button>`).join(''):'<div class="empty">No curated places match. Clear search or load OpenStreetMap places.</div>';list.querySelectorAll('.place').forEach(b=>b.addEventListener('click',()=>focus(POIS.find(p=>p.n===b.dataset.name))));}
    function drawFilters(){filters.innerHTML=Object.entries(CAT).map(([key,[label,emoji]])=>`<button class="chip ${state.filter===key?'active':''}" data-filter="${key}">${emoji} ${label}</button>`).join('');filters.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;drawFilters();draw()}));}
    function bindApple(){map.on('popupopen',event=>{const a=event.popup.getElement()?.querySelector('.apple-route');if(!a)return;a.addEventListener('click',e=>{const lat=a.dataset.lat,lng=a.dataset.lng;if(/iPhone|iPad|iPod/.test(navigator.userAgent)){e.preventDefault();window.location.href=`maps://?daddr=${encodeURIComponent(lat+','+lng)}&dirflg=d`;setTimeout(()=>{window.location.href=appleURL({lat,lng})},700)}})})}
    function cachedOSM(){try{const raw=JSON.parse(localStorage.getItem('nc-explore-osm-v1'));return raw&&Date.now()-raw.saved<604800000&&Array.isArray(raw.data)?raw.data:null}catch{return null}}
    function normalizeOSM(elements){const seen=new Set();return elements.map(x=>{const lat=x.lat??x.center?.lat,lng=x.lon??x.center?.lon,t=x.tags||{};if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;const n=t.name||t['name:en']||`${t.waterway==='waterfall'||t.natural==='waterfall'?'Unnamed waterfall':'Scenic viewpoint'}`;const key=`${n}|${lat.toFixed(4)}|${lng.toFixed(4)}`;if(seen.has(key))return null;seen.add(key);const waterfall=t.waterway==='waterfall'||t.natural==='waterfall';return {n,c:waterfall?'waterfall':'view',e:waterfall?'💧':'⛰️',lat,lng,r:t['addr:county']||'North Carolina',kid:waterfall?'OpenStreetMap waterfall':'OpenStreetMap viewpoint',dog:true,note:`${waterfall?'Waterfall':'Scenic viewpoint'} mapped in OpenStreetMap. Confirm access, parking, trail conditions, and pet rules locally.`,source:'OpenStreetMap'}}).filter(Boolean)}
    async function loadOSM(){const saved=cachedOSM();if(saved){state.osm=saved;state.osmLoaded=true;draw();toast(`Loaded ${saved.length} cached OSM places.`);return}const btn=$('#loadOSM');btn.textContent='Loading statewide map data…';btn.classList.add('loading');try{const q=`[out:json][timeout:90];(nwr["waterway"="waterfall"](33.65,-84.45,36.65,-75.35);nwr["natural"="waterfall"](33.65,-84.45,36.65,-75.35);nwr["tourism"="viewpoint"](33.65,-84.45,36.65,-75.35););out center tags;`;const response=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});if(!response.ok)throw new Error('Map-data service unavailable');const json=await response.json();state.osm=normalizeOSM(json.elements||[]);state.osmLoaded=true;localStorage.setItem('nc-explore-osm-v1',JSON.stringify({saved:Date.now(),data:state.osm}));draw();toast(`Loaded ${state.osm.length} OSM waterfalls and viewpoints.`)}catch(error){toast('Could not load map data. Try again on a stronger connection.')}finally{btn.textContent='＋ Load OSM waterfalls & views';btn.classList.remove('loading')}}
    search.addEventListener('input',()=>{state.query=search.value.trim();draw()});$('#clear').addEventListener('click',()=>{search.value='';state.query='';search.focus();draw()});$('#resetMap').addEventListener('click',()=>map.flyTo([35.46,-80.7],7));$('#loadOSM').addEventListener('click',loadOSM);$('#locate').addEventListener('click',()=>{if(!navigator.geolocation)return toast('Location is unavailable in this browser.');toast('Finding your location…');navigator.geolocation.getCurrentPosition(pos=>{const point=[pos.coords.latitude,pos.coords.longitude];L.circleMarker(point,{radius:9,color:'#fff',weight:3,fillColor:'#e87536',fillOpacity:1}).addTo(map).bindPopup('Your location');map.flyTo(point,12);toast('Location found.');},()=>toast('Location permission was not granted.'),{enableHighAccuracy:true,timeout:9000,maximumAge:60000})});
    drawFilters();draw();bindApple();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  })();
  </script>
</body>
</html>
