<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest"><title>Draft Command 2026</title><style>body{margin:0;background:#07111f;color:#edf5ff;font:15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header,main{max-width:1300px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #294866}.card{background:#10233a;border:1px solid #294866;border-radius:12px;padding:15px;margin:12px 0}.grid,.recs,.main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.main{grid-template-columns:1fr 320px}.label{font-size:11px;color:#58a9ff;font-weight:bold;letter-spacing:.1em}.big{font-size:20px;font-weight:bold}.muted{color:#9eb2ca;font-size:13px}.live{color:#56d99e;font-weight:bold}.error{color:#ff9baa;font-weight:bold}button,input,select{padding:8px;border-radius:7px;border:1px solid #294866;background:#0a192a;color:#edf5ff}button{background:#58a9ff;color:#07111f;font-weight:bold}.rec{border:1px solid #35648c;border-radius:9px;padding:12px}.why{font-size:12px;line-height:1.5}.yes{color:#56d99e}.no{color:#ffd166}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #294866}#board{max-height:600px;overflow:auto}.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #294866}.pos{color:#58a9ff;font-weight:bold}@media(max-width:750px){.grid,.recs,.main{grid-template-columns:1fr}.main{display:block}}</style><header><div><b>Draft Command 2026</b><div class="muted">Matter of Fak • Sleeper live companion</div></div><div><span id="state" class="live">CONNECTING</span> <button onclick="go()">Reconnect</button></div></header><main><section class="grid"><div class="card"><div class="label">DRAFT STATUS</div><div id="ds" class="big">Loading</div><div id="err" class="muted"></div></div><div class="card"><div class="label">YOUR NEXT PICK</div><div id="np" class="big">—</div><div id="nm" class="muted">Slot 1.11</div></div><div class="card"><div class="label">LATEST PICK</div><div id="lp" class="big">—</div><div id="lm" class="muted"></div></div></section><section class="card"><div class="label">BALANCED RECOMMENDATIONS</div><h2>Best players now</h2><div id="recs" class="recs"></div></section><section class="main"><div class="card"><div class="label">AVAILABLE PLAYERS</div><input id="q" placeholder="Search player" oninput="render()"> <select id="f" onchange="render()"><option value="">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select><div id="board"><table><thead><tr><th>Rank</th><th>Player</th><th>Pos</th><th>Team</th><th>Status</th><th>Tier</th></tr></thead><tbody id="tb"></tbody></table></div></div><aside><div class="card"><div class="label">MATTER OF FAK</div><div id="roster"></div></div><div class="card"><div class="label">GUIDANCE</div><div id="guide" class="muted"></div></div><div class="card"><div class="label">RECENT PICKS</div><div id="log"></div></div></aside></section></main><script>const A='https://api.sleeper.app/v1',L='1389359304355610624',U='biggojohnson';let P={},X=[],D,R=[],M,T;const $=x=>document.querySelector(x),api=async x=>{let r=await fetch(A+x);if(!r.ok)throw Error(x+' returned HTTP '+r.status);return r.json()},name=p=>p?((p.first_name+' '+p.last_name).trim()||p.full_name||'Unknown'):'Unknown',rank=p=>+(p.search_rank||p.search_rank_half_ppr||p.search_rank_ppr||p.search_rank_ecr||99999),pos=x=>P[x.player_id]?.position||x.metadata?.position||'',my=()=>X.filter(x=>x.roster_id===M),need=z=>my().filter(x=>pos(x)===z).length<({QB:1,RB:2,WR:2,TE:1}[z]||0)?18:['RB','WR','TE'].includes(z)?4:0,tier=p=>rank(p)<18?1:rank(p)<42?2:rank(p)<72?3:rank(p)<110?4:rank(p)<160?5:6,available=()=>Object.values(P).filter(p=>['QB','RB','WR','TE','K','DEF'].includes(p.position)&&!new Set(X.map(x=>x.player_id)).has(p.player_id)&&rank(p)<99999).sort((a,b)=>rank(a)-rank(b)),team=id=>{let r=R.find(x=>x.roster_id===id),u=D.users.find(x=>x.user_id===r?.owner_id);return u?.metadata?.team_name||u?.display_name||'Roster '+id};function render(){let z=available(),last=X.at(-1),q=$('#q').value.toLowerCase(),f=$('#f').value;$('#ds').textContent=D.status==='drafting'?'LIVE DRAFT':D.status;$('#lp').textContent=last?last.pick_no+'. '+name(P[last.player_id]):'No picks yet';$('#lm').textContent=last?team(last.roster_id):'';let rec=z.slice(0,3);$('#recs').innerHTML=rec.map((p,i)=>{let a=['Sleeper rank #'+rank(p),need(p.position)>=18?'Fills unfilled '+p.position+' starter need':'Can fit roster construction',tier(p)<=3?'Still in Tier '+tier(p):''],b=[p.injury_status?'Sleeper status: '+p.injury_status:'No listed injury designation',need(p.position)<10?'Roster does not force '+p.position+' now':''];return '<div class="rec"><b>'+(i+1)+'. '+name(p)+'</b><div class="muted">'+p.position+' • '+(p.team||'FA')+' • Tier '+tier(p)+'</div><div class="why"><span class="yes">Why consider</span><br>'+a.filter(Boolean).join('<br>')+'</div><div class="why"><span class="no">Why hesitate</span><br>'+b.filter(Boolean).join('<br>')+'</div></div>'}).join('');$('#tb').innerHTML=z.filter(p=>(!f||p.position===f)&&name(p).toLowerCase().includes(q)).slice(0,250).map(p=>'<tr><td>'+rank(p)+'</td><td>'+name(p)+'</td><td class="pos">'+p.position+'</td><td>'+(p.team||'FA')+'</td><td class="muted">'+(p.injury_status||p.status||'Active')+'</td><td>'+tier(p)+'</td></tr>').join('');$('#roster').innerHTML=my().map(x=>'<div class="row"><span>'+name(P[x.player_id])+'</span><span class="pos">'+pos(x)+'</span></div>').join('')||'<span class="muted">No picks yet</span>';let miss=['QB','RB','WR','TE'].filter(v=>my().filter(x=>pos(x)===v).length<({QB:1,RB:2,WR:2,TE:1}[v]));$('#guide').innerHTML=miss.length?'Prioritize <b>'+miss.join(' / ')+'</b> when values are close.':'Core starters covered; prioritize RB/WR/TE flex value.';$('#log').innerHTML=X.slice(-8).reverse().map(x=>'<div class="row">'+x.pick_no+'. '+name(P[x.player_id])+' <span class="muted">'+team(x.roster_id)+'</span></div>').join('')}async function tick(){X=await api('/draft/'+D.draft_id+'/picks');render()}async function go(){clearInterval(T);$('#state').className='live';$('#state').textContent='CONNECTING';$('#err').textContent='';try{let[l,u,r,ds,me]=await Promise.all([api('/league/'+L),api('/league/'+L+'/users'),api('/league/'+L+'/rosters'),api('/league/'+L+'/drafts'),api('/user/'+U)]);D=ds.find(x=>x.status==='drafting')||ds.find(x=>x.draft_id===l.draft_id)||ds.at(-1);if(!D)throw Error('No draft found for this league');D.users=u;R=r;M=r.find(x=>x.owner_id===me.user_id)?.roster_id;if(!M)throw Error('Could not match Sleeper username to a roster');P=await api('/players/nfl');await tick();T=setInterval(()=>tick().catch(e=>{$('#state').className='error';$('#state').textContent='REFRESH ERROR';$('#err').textContent=e.message}),3000);$('#state').textContent=D.status==='drafting'?'LIVE • 3 SEC':'CONNECTED'}catch(e){$('#state').className='error';$('#state').textContent='CONNECTION ERROR';$('#ds').textContent='Unable to load Sleeper';$('#err').textContent=e.message}}if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');go()</script>
