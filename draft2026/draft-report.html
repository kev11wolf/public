<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FarmersOnly Draft Report</title><style>:root{--bg:#07111f;--panel:#10233a;--line:#294866;--ink:#eef6ff;--muted:#9eb2ca;--blue:#58a9ff;--green:#8ee5ae;--gold:#ffd166}*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font:16px/1.48 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}header,main{max-width:1220px;margin:auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}header{padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:18px;border-bottom:1px solid var(--line);background:linear-gradient(125deg,#0a1d33,#07111f)}h1{margin:0;font-size:clamp(28px,7vw,42px);letter-spacing:-.04em;line-height:1.05}.sub{margin-top:8px;color:var(--muted);font-size:15px}.filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}button{appearance:none;min-height:44px;touch-action:manipulation;background:#193251;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:800;letter-spacing:.03em;cursor:pointer}button.active{background:var(--blue);color:#07111f;border-color:var(--blue)}main{padding-top:18px;padding-bottom:30px}.summary{color:var(--muted);font-size:13px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}.card{background:linear-gradient(160deg,#112942,#0d2036);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 24px #0003}.card.top{border-color:#56d99e;box-shadow:0 0 0 1px #56d99e25,0 8px 24px #0003}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.handle{color:var(--blue);text-transform:uppercase;font-size:11px;letter-spacing:.095em;font-weight:900;overflow-wrap:anywhere}.name{font-size:21px;line-height:1.1;font-weight:900;letter-spacing:-.025em;margin-top:3px}.grade{flex:0 0 auto;font-size:29px;line-height:1;color:var(--green);font-weight:950}.label{margin-top:17px;color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.105em;font-weight:900}.good,.bad{margin-top:4px;font-size:15px}.good{color:var(--green)}.bad{color:var(--gold)}@media(max-width:600px){header{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:15px}main{padding-top:14px}.grid{grid-template-columns:1fr;gap:11px}.card{border-radius:14px;padding:15px}.name{font-size:20px}.good,.bad{font-size:16px}}</style></head><body><header><h1>FarmersOnly Draft Report</h1><div class="sub">Completed-board grades, clean takeaways, and the occasional deserved roast.</div><div id="filter" class="filter" aria-label="Filter team grades"></div></header><main><p id="summary" class="summary"></p><section id="cards" class="grid" aria-live="polite"></section></main><script>const teams=[['BigBoiSeason','BigBoiSeason','B+','Jahmyr Gibbs and Quinshon Judkins anchor an explosive RB room, while Drake London, George Pickens, Terry McLaurin, Jordan Addison, and Kyle Pitts supply genuine weekly upside.','Jaxson Dart and Pitts make the lineup volatile; this team can look brilliant or make you stare at the app like it owes you money.'],['ItalianGardettos','Italian Gardettos','B+','Bijan Robinson, Josh Allen, Jeremiyah Love, Tetairoa McMillan, DJ Moore, and Brian Thomas Jr. give this team serious ceiling and a reasonable RB/WR base.','Allen was an expensive early QB swing and the TE room is thin. One injury and this roster starts sweating immediately.'],['mattcinelli','mattcinelli','B-','Christian McCaffrey, Brock Bowers, Trey McBride, Zay Flowers, Joe Burrow, and Michael Pittman is a talent-rich core.','Two premium TEs in a one-TE lineup is buying two lawnmowers for a one-yard lawn. RB depth is not convincing.'],['mmalsin','mmalsin','B','Ja’Marr Chase, Nico Collins, Javonte Williams, Bucky Irving, Colston Loveland, and Sam LaPorta gives this build an elite pass-catching foundation.','The roster paid heavily for receivers and tight end; the backs now have to outperform their draft cost.'],['michaelb5555','michaelb5555','B+','Jonathan Taylor, Ashton Jeanty, Rashee Rice, Emeka Egbuka, Davante Adams, and Jameson Williams is a nasty blend of youth, volume, and upside.','The final layers need dependable depth. This build is betting on ceiling and hoping the injury gods are busy elsewhere.'],['milesbarrios','milesbarrios','A-','Jaxon Smith-Njigba, Kyren Williams, Cam Skattebo, Garrett Wilson, Tyler Warren, and Jayden Reed gives the team balance and strong flex potential.','The core is good enough that the advice is simple: stop getting cute and keep drafting playable depth.'],['mattyoungin','mattyoungin','B+','James Cook, A.J. Brown, Ladd McConkey, D’Andre Swift, Jameson Williams, and Tyler Warren makes for a balanced high-floor start.','QB can wait, but the RB room needs one more dependable option before the bench becomes decorative.'],['miqbar24','miqbar24','B','Saquon Barkley, Kenneth Walker, Jaylen Waddle, Tucker Kraft, Christian Watson, and Chris Godwin form a capable RB/WR core.','The depth and QB plan need work. Good roster, not a bulletproof one.'],['moneymike805','moneymike805','B+','Amon-Ra St. Brown, Derrick Henry, Chris Olave, David Montgomery, TreVeyon Henderson, and Woody Marks is strong at both RB and WR.','There are few obvious holes, so the remaining work is resisting shiny nonsense and adding depth.'],['adamloo','adamloo','A','Puka Nacua, Omarion Hampton, Breece Hall, Tee Higgins, Jalen Hurts, and Josh Jacobs creates a high-ceiling weekly lineup.','The RB room is excellent, but this team still has to finish TE and depth without stepping on its own shoelaces.'],['BiggoJohnson','Matter of Fak','A','De’Von Achane, Chase Brown, Travis Etienne, J.K. Dobbins, Rome Odunze, Mike Evans, Jakobi Meyers, Wan’Dale Robinson, Lamar Jackson, and Jake Ferguson makes this an absurdly deep, flexible build.','Alec Pierce came earlier than necessary. That is the roast. The rest is annoyingly difficult to kill.'],['nforbes6','nforbes6','A-','Justin Jefferson, CeeDee Lamb, Malik Nabers, DeVonta Smith, Bhayshul Tuten, and Jaylen Warren is a terrifying WR room with real trade leverage.','RB depth is the glaring problem. This can win the beauty contest and still get punched in the lineup by Week 4.']];const cards=document.querySelector('#cards'),filter=document.querySelector('#filter'),summary=document.querySelector('#summary');let active='ALL';['ALL','A','B','C'].forEach(g=>{const b=document.createElement('button');b.type='button';b.textContent=g==='ALL'?'All teams':g+' grades';b.setAttribute('aria-pressed',g==='ALL');b.onclick=()=>{active=g;document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.classList.add('active');b.setAttribute('aria-pressed','true');render()};if(g==='ALL')b.classList.add('active');filter.appendChild(b)});function render(){const view=teams.filter(t=>active==='ALL'||t[2].startsWith(active));summary.textContent=`${view.length} of ${teams.length} teams shown`;cards.innerHTML=view.map(t=>`<article class="card ${t[0]==='BiggoJohnson'?'top':''}"><div class="head"><div><div class="handle">${t[0]}</div><div class="name">${t[1]}</div></div><div class="grade" aria-label="Grade ${t[2]}">${t[2]}</div></div><div class="label">Good</div><div class="good">${t[3]}</div><div class="label">Bad / ugly</div><div class="bad">${t[4]}</div></article>`).join('')}render()</script></body></html>
