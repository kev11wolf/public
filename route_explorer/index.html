    <style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
    }

    body {
        -webkit-tap-highlight-color: transparent;
    }

    #app-shell {
        position: relative;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
        background: #0f172a;
    }

    #map {
        position: absolute;
        inset: 0;
        height: 100%;
        width: 100%;
        z-index: 1;
    }

        .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .top-safe { margin-top: max(8px, env(safe-area-inset-top)); }

    .leaflet-routing-container,
    .leaflet-routing-error,
    .leaflet-right {
        display: none !important;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .leaflet-map-pane {
        transform: translate3d(0, 0, 0);
        will-change: transform;
    }

    #top-directions-shell,
    #bottom-controls-shell {
        will-change: transform, opacity;
    }

    #apple-navigation-hud {
        min-height: 78px;
    }

    #route-mileage-sticky {
        backdrop-filter: blur(18px);
    }

    #master-header-panel {
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.25);
    }

    .custom-popup .leaflet-popup-content-wrapper {
    max-width: 330px !important;
    overflow: hidden;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 18px 40px rgb(15 23 42 / 0.24);
}

.custom-popup .leaflet-popup-content {
    width: 300px !important;
    max-width: calc(100vw - 48px) !important;
    margin: 0 !important;
}

.custom-popup .leaflet-popup-tip {
    background: #ffffff;
}

.custom-popup .leaflet-popup-content a,
.custom-popup .leaflet-popup-content button {
    color: #ffffff !important;
    text-decoration: none;
}

    .route-callout-marker {
        transition: transform 0.2s ease-in-out;
    }

    .route-callout-marker:hover {
        transform: scale(1.05);
        z-index: 9999 !important;
    }
    
    /* Consistent, touch-friendly POI filters */
.master-pill,
.sub-pill {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}

.master-pill:focus-visible,
.sub-pill:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 2px;
}

/* Respect users who prefer less movement */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
/* ── iOS / iPadOS app-shell hardening ─────────────────────────────── */

:root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
}

html,
body {
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
}

#app-shell {
    min-height: 100svh;
    height: 100dvh;
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
}

#bottom-controls-shell {
    padding-bottom: max(8px, var(--safe-bottom));
}

#persistent-fab-shell {
    padding-top: max(8px, var(--safe-top));
}

#master-filter-bar,
#sub-filter-bar {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
}

.master-pill,
.sub-pill {
    scroll-snap-align: start;
    min-height: 44px;
    -webkit-tap-highlight-color: transparent;
}

button,
input,
select {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

#search-container input {
    font-size: 16px;
}

/* Prevent iOS Safari from zooming on input focus. */

@media (max-width: 390px) {
    #master-header-panel {
        border-radius: 20px;
    }

    #search-container {
        padding-left: 10px;
        padding-right: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}

        function triggerToast(message, duration = 2400) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const activeToasts = [...container.querySelectorAll('[data-toast]')];

    if (activeToasts.some((toast) => toast.textContent === message)) {
        return;
    }

    const toast = document.createElement('div');

    toast.dataset.toast = 'true';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');

    toast.className =
        'bg-slate-900/95 backdrop-blur-sm text-white text-sm font-semibold ' +
        'px-4 py-2.5 rounded-xl shadow-lg transition-all duration-200 ' +
        'opacity-0 translate-y-2 pointer-events-auto';

    toast.textContent = message;
    container.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
    });

    window.setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');

        window.setTimeout(() => {
            toast.remove();
        }, 200);
    }, duration);
}
        function updateInlineStatus(text, showSpinner = false) {
    const statusLabel = document.getElementById('status');

    if (statusLabel) {
        statusLabel.innerText = text;
        statusLabel.setAttribute('aria-live', 'polite');
    }

    const spinner = document.getElementById('status-spinner');

    if (spinner) {
        spinner.classList.toggle('hidden', !showSpinner);
        spinner.setAttribute('aria-hidden', showSpinner ? 'false' : 'true');
    }
}

function setLoadingStatus(text) {
    updateInlineStatus(text, true);
}

function setReadyStatus(text) {
    updateInlineStatus(text, false);
}

        function buildCleanAddressString(addr, displayNameFallback) {
    if (!addr) return displayNameFallback.split(',').slice(0, 3).join(', ');

    const tokens = [];

    const roadLine = addr.house_number && addr.road
        ? `${addr.house_number} ${addr.road}`
        : (addr.road || '');

    if (roadLine) tokens.push(roadLine);

    const city = addr.city || addr.town || addr.village || addr.suburb;
    if (city) tokens.push(city);

    if (addr.state) tokens.push(addr.state);
    if (addr.postcode) tokens.push(addr.postcode);

    return tokens.length > 0
        ? tokens.join(', ')
        : displayNameFallback.split(',').slice(0, 3).join(', ');
}

function escapeHTML(value = '') {
    return String(value).replace(/[&<>"']/g, (character) => {
        const entities = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        };

        return entities[character];
    });
}

function getLogicalPoiName(poi) {
    const rawName = String(poi.name || '').trim();
    const brandName = cleanBrandNames[poi.brand] || '';

    const genericNames = new Set([
        '',
        'unnamed location',
        'location',
        'public facility',
        'gas station',
        'fast food',
        'shopping & services',
        'parks & attractions',
        'emergency medical'
    ]);

    if (!genericNames.has(rawName.toLowerCase())) {
        return rawName;
    }

    if (brandName) {
        return brandName;
    }

    if (categoryConfigs[poi.category]?.name) {
        return categoryConfigs[poi.category].name;
    }

    return 'Unnamed location';
}

function getSafeWebsiteUrl(website) {
    if (!website) {
        return '';
    }

    const possibleUrl = String(website).trim();

    try {
        const url = new URL(
            possibleUrl.startsWith('http')
                ? possibleUrl
                : `https://${possibleUrl}`
        );

        return ['http:', 'https:'].includes(url.protocol)
            ? url.href
            : '';
    } catch {
        return '';
    }
}

function buildPoiPopupContent(poi, options = {}) {
    const logicalName = getLogicalPoiName(poi);

    const categoryName =
        cleanBrandNames[poi.brand] ||
        categoryConfigs[poi.category]?.name ||
        poi.category ||

function getPoiAddress(poi) {
    const directAddress =
        poi.a ||
        poi.address ||
        poi.addr ||
        poi.fullAddress ||
        poi.full_address ||
        '';

    const city = poi.city || poi.town || poi.village || '';
    const state = poi.state || '';
    const zip = poi.zip || poi.postcode || '';

    if (directAddress) return directAddress;

    const locationParts = [city, state, zip].filter(Boolean);

    return locationParts.length > 0
        ? locationParts.join(', ')
        : 'Address not available in this POI data file';
}

function normalizePoi(rawPoi) {
    const latitude = Number(rawPoi.lat ?? rawPoi.latitude);
    const longitude = Number(rawPoi.lon ?? rawPoi.lng ?? rawPoi.longitude);

    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        return null;
    }

    return {
        id: rawPoi.id || `${latitude.toFixed(6)},${longitude.toFixed(6)}`,
        lat: latitude,
        lon: longitude,
        name: rawPoi.n || rawPoi.name || 'Unnamed location',
        brand: rawPoi.b || rawPoi.brand || '',
        category: rawPoi.c || rawPoi.category || '',
        address: getPoiAddress(rawPoi),
        hours: rawPoi.h || rawPoi.hours || 'Hours not available',
        description: rawPoi.d || rawPoi.desc || rawPoi.description || '',
        phone: rawPoi.phone || rawPoi.tel || '',
        website: rawPoi.website || rawPoi.url || '',
        g87: rawPoi.g87 ?? 0,
        g88: rawPoi.g88 ?? 0
    };
}

        function roundCoords(num) { return Math.round(parseFloat(num) * 10000) / 10000; }

        function calculateIntersectedStates(routeCoords) {
            const matchedStates = new Set();
            const sampleRate = Math.max(1, Math.floor(routeCoords.length / 100));
            for (let i = 0; i < routeCoords.length; i += sampleRate) {
                const pt = routeCoords[i];
                for (const [stateName, bbox] of Object.entries(STATE_BOUNDS_LOOKUP)) {
                    if (pt.lat >= bbox.s && pt.lat <= bbox.n && pt.lng >= bbox.w && pt.lng <= bbox.e) {
                        matchedStates.add(stateName);
                    }
                }
            }
            return Array.from(matchedStates);
        }

        function dispatchOffThreadAnalysis() {
    if (
        !mathWorker ||
        !currentMasterCat ||
        !Array.isArray(localJsonMemory) ||
        localJsonMemory.length === 0 ||
        routeLineCoordinates.length < 2
    ) {
        return;
    }

    const maxRoutePointsForPoiSearch = 500;

    const routePointStep = Math.max(
        1,
        Math.ceil(routeLineCoordinates.length / maxRoutePointsForPoiSearch)
    );

    const routePoints = routeLineCoordinates
        .filter((_, index) => index % routePointStep === 0)
        .map((point) => ({
            lat: point.lat,
            lng: point.lng
        }));

    const finalRoutePoint = routeLineCoordinates[routeLineCoordinates.length - 1];
    const lastSearchPoint = routePoints[routePoints.length - 1];

    if (
        !lastSearchPoint ||
        lastSearchPoint.lat !== finalRoutePoint.lat ||
        lastSearchPoint.lng !== finalRoutePoint.lng
    ) {
        routePoints.push({
            lat: finalRoutePoint.lat,
            lng: finalRoutePoint.lng
        });
    }

    mathWorker.postMessage({
        pois: localJsonMemory,
        routePoints,
        activeBufferMeters,
        currentMasterCat,
        currentSubFilter
    });
}

        function findClosestPointOnLineSegment(p, p1, p2) {
            const x = p.lat, y = p.lng;
            const x1 = p1.lat, y1 = p1.lng;
            const x2 = p2.lat, y2 = p2.lng;
            const dx = x2 - x1, dy = y2 - y1;
            if (dx === 0 && dy === 0) return p1;
            let t = ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy);
            t = Math.max(0, Math.min(1, t));
            return L.latLng(x1 + t * dx, y1 + t * dy);
        }

        function computeSnapToRouteVector(actualLatLng) {
            if (routeLineCoordinates.length === 0) return actualLatLng;
            let minimumObservedDistance = Infinity;
            let optimalSnappedLocation = actualLatLng;
            let optimalIndex = 0;
            
            let startSearchIndex = 0;
            let endSearchIndex = routeLineCoordinates.length - 1;
            if (currentTrackedPolylineIndex > 0 && routeLineCoordinates.length > 100) {
                startSearchIndex = Math.max(0, currentTrackedPolylineIndex - 30);
                endSearchIndex = Math.min(routeLineCoordinates.length - 1, currentTrackedPolylineIndex + 30);
            }
            
            for (let i = startSearchIndex; i < endSearchIndex; i++) {
                const candidatePoint = findClosestPointOnLineSegment(actualLatLng, routeLineCoordinates[i], routeLineCoordinates[i + 1]);
                const evaluationDistance = map.distance(actualLatLng, candidatePoint);
                if (evaluationDistance < minimumObservedDistance) {
                    minimumObservedDistance = evaluationDistance;
                    optimalSnappedLocation = candidatePoint;
                    optimalIndex = i;
                }
            }
            
            if (minimumObservedDistance > 45 && routeLineCoordinates.length > 100) {
                for (let i = 0; i < routeLineCoordinates.length - 1; i++) {
                    const candidatePoint = findClosestPointOnLineSegment(actualLatLng, routeLineCoordinates[i], routeLineCoordinates[i + 1]);
                    const evaluationDistance = map.distance(actualLatLng, candidatePoint);
                    if (evaluationDistance < minimumObservedDistance) {
                        minimumObservedDistance = evaluationDistance;
                        optimalSnappedLocation = candidatePoint;
                        optimalIndex = i;
                    }
                }
            }
            
            currentTrackedPolylineIndex = optimalIndex;
            return (minimumObservedDistance < 35) ? optimalSnappedLocation : actualLatLng;
        }

        function resolveDirectionalManeuverSymbol(text) {
            const raw = text.toLowerCase();
            if (raw.includes('left') && raw.includes('sharp')) return '⮌';
            if (raw.includes('right') && raw.includes('sharp')) return '⮎';
            if (raw.includes('left') && raw.includes('slight')) return '↖️';
            if (raw.includes('right') && raw.includes('slight')) return '↗️';
            if (raw.includes('left')) return '⬅️';
            if (raw.includes('right')) return '➡️';
            if (raw.includes('roundabout') || raw.includes('u-turn')) return '🔄';
            return '⬆️';
        }

        const workerBlobCode = `
    const EARTH_RADIUS_METERS = 6371000;

    function toRadians(degrees) {
        return degrees * Math.PI / 180;
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
        const dLat = toRadians(lat2 - lat1);
        const dLon = toRadians(lon2 - lon1);

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(toRadians(lat1)) *
            Math.cos(toRadians(lat2)) *
            Math.sin(dLon / 2) ** 2;

        return EARTH_RADIUS_METERS * 2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
    }

    function distanceToSegmentMeters(point, start, end) {
        const referenceLatitude = toRadians((start.lat + end.lat) / 2);

        const metersPerDegreeLatitude = 111320;
        const metersPerDegreeLongitude =
            111320 * Math.cos(referenceLatitude);

        const pointX = point.lng * metersPerDegreeLongitude;
        const pointY = point.lat * metersPerDegreeLatitude;

        const startX = start.lng * metersPerDegreeLongitude;
        const startY = start.lat * metersPerDegreeLatitude;

        const endX = end.lng * metersPerDegreeLongitude;
        const endY = end.lat * metersPerDegreeLatitude;

        const deltaX = endX - startX;
        const deltaY = endY - startY;
        const segmentLengthSquared = deltaX ** 2 + deltaY ** 2;

        if (segmentLengthSquared === 0) {
            return haversineMeters(point.lat, point.lng, start.lat, start.lng);
        }

        const projection =
            ((pointX - startX) * deltaX + (pointY - startY) * deltaY) /
            segmentLengthSquared;

        const clampedProjection = Math.max(0, Math.min(1, projection));

        const closestX = startX + clampedProjection * deltaX;
        const closestY = startY + clampedProjection * deltaY;

        return Math.hypot(pointX - closestX, pointY - closestY);
    }

    function matchesSelectedFilter(poi, masterCategory, subFilter) {
        if (poi.category !== masterCategory) return false;
        if (subFilter === 'none') return true;

        if (subFilter === 'unl87') return poi.g87 === 1;
        if (subFilter === 'unl88') return poi.g88 === 1;

        return poi.brand === subFilter || poi.category === subFilter;
    }

    self.onmessage = function(event) {
        const {
            pois,
            routePoints,
            activeBufferMeters,
            currentMasterCat,
            currentSubFilter
        } = event.data;

        if (!Array.isArray(pois) || !Array.isArray(routePoints) || routePoints.length < 2) {
            self.postMessage({ matches: [] });
            return;
        }

        const matches = [];

        for (const poi of pois) {
            if (!matchesSelectedFilter(poi, currentMasterCat, currentSubFilter)) {
                continue;
            }

            let shortestDistanceMeters = Infinity;

            for (let index = 0; index < routePoints.length - 1; index++) {
                const distanceMeters = distanceToSegmentMeters(
                    { lat: poi.lat, lng: poi.lon },
                    routePoints[index],
                    routePoints[index + 1]
                );

                if (distanceMeters < shortestDistanceMeters) {
                    shortestDistanceMeters = distanceMeters;
                }

                if (shortestDistanceMeters <= activeBufferMeters) {
                    break;
                }
            }

            if (shortestDistanceMeters <= activeBufferMeters) {
                matches.push({
                    ...poi,
                    distanceFromRouteMeters: shortestDistanceMeters
                });
            }
        }

        matches.sort(
            (first, second) =>
                first.distanceFromRouteMeters - second.distanceFromRouteMeters
        );

        self.postMessage({ matches });
    };
`;

        function runCachedAutocompleteSearch(inputElement, dropdownElement) {
    const query = inputElement.value.trim();

    const clearBtn = document.getElementById(
        inputElement.id === 'start-input'
            ? 'start-clear-btn'
            : 'end-clear-btn'
    );

    if (query.length > 0) {
        clearBtn.classList.remove('hidden');
    } else {
        clearBtn.classList.add('hidden');
    }

    // If text changes after a location was selected,
    // remove old coordinates so the route cannot use stale data.
    delete inputElement.dataset.lat;
    delete inputElement.dataset.lon;

    if (query.length < 3) {
        dropdownElement.innerHTML = '';
        dropdownElement.classList.add('hidden');
        inputElement.setAttribute('aria-expanded', 'false');
        return;
    }

    const mapCenter = map.getCenter();

    const cacheKey = [
        query.toLowerCase(),
        mapCenter.lat.toFixed(1),
        mapCenter.lng.toFixed(1)
    ].join('|');

    if (autocompleteQueryMemoryCache.has(cacheKey)) {
        renderAutocompleteDropdownDOM(
            autocompleteQueryMemoryCache.get(cacheKey),
            inputElement,
            dropdownElement
        );
        return;
    }

    if (autocompleteAbortController) {
        autocompleteAbortController.abort();
    }

    autocompleteAbortController = new AbortController();

    const photonUrl = new URL('https://photon.komoot.io/api');

    photonUrl.searchParams.set('q', query);
    photonUrl.searchParams.set('limit', '6');
    photonUrl.searchParams.set('lang', 'en');
    photonUrl.searchParams.set('lat', mapCenter.lat.toFixed(6));
    photonUrl.searchParams.set('lon', mapCenter.lng.toFixed(6));
    photonUrl.searchParams.set('zoom', String(Math.round(map.getZoom())));

    fetch(photonUrl, {
        signal: autocompleteAbortController.signal
    })
        .then((response) => {
            if (!response.ok) {
                throw new Error(`Photon request failed: ${response.status}`);
            }

            return response.json();
        })
        .then((data) => {
            const features = Array.isArray(data.features)
                ? data.features
                : [];

            autocompleteQueryMemoryCache.set(cacheKey, features);

            renderAutocompleteDropdownDOM(
                features,
                inputElement,
                dropdownElement
            );
        })
        .catch((error) => {
            if (error.name === 'AbortError') {
                return;
            }

            console.warn('Photon autocomplete request failed.', error);

            dropdownElement.innerHTML = '';
            dropdownElement.classList.add('hidden');
            inputElement.setAttribute('aria-expanded', 'false');
        });
}

        function renderAutocompleteDropdownDOM(
    features,
    inputElement,
    dropdownElement
) {
    dropdownElement.innerHTML = '';

    if (!features || features.length === 0) {
        const noResult = document.createElement('div');

        noResult.className =
            'px-3 py-3 rounded-xl bg-slate-50 text-xs text-slate-500';

        noResult.textContent =
            'No matches found. Try an address, city, ZIP code, or business name.';

        dropdownElement.appendChild(noResult);
        dropdownElement.classList.remove('hidden');
        inputElement.setAttribute('aria-expanded', 'true');
        return;
    }

    dropdownElement.classList.remove('hidden');
    inputElement.setAttribute('aria-expanded', 'true');

    features.forEach((feature, index) => {
        const properties = feature.properties || {};
        const coordinates = feature.geometry?.coordinates || [];

        const longitude = Number(coordinates[0]);
        const latitude = Number(coordinates[1]);

        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
            return;
        }

        const name =
            properties.name ||
            [properties.housenumber, properties.street]
                .filter(Boolean)
                .join(' ') ||
            properties.city ||
            'Unnamed location';

        const details = [
            properties.housenumber && properties.street
                ? `${properties.housenumber} ${properties.street}`
                : properties.street,
            properties.city || properties.town || properties.village,
            properties.state,
            properties.postcode
        ]
            .filter(Boolean)
            .filter((part, partIndex, allParts) =>
                allParts.indexOf(part) === partIndex
            )
            .join(' • ');

        const isAddress =
            properties.housenumber ||
            properties.street ||
            properties.osm_key === 'highway';

        const resultIcon = isAddress
            ? '⌖'
            : properties.osm_key === 'place'
                ? '⌘'
                : '●';

        const option = document.createElement('button');

        option.type = 'button';
        option.role = 'option';
        option.id = `${inputElement.id}-option-${index}`;

        option.className =
            'flex w-full items-center gap-3 border-b border-slate-100 bg-white px-3 py-3 text-left transition-colors last:border-0 hover:bg-blue-50 focus:bg-blue-50 focus:outline-none';

        const iconCircle = document.createElement('span');
        iconCircle.className =
            'flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-50 text-base font-bold text-blue-600';
        iconCircle.setAttribute('aria-hidden', 'true');
        iconCircle.textContent = resultIcon;

        const textArea = document.createElement('span');
        textArea.className = 'min-w-0 flex-1';

        const title = document.createElement('span');
        title.className =
            'block truncate text-[13px] font-bold text-slate-900';
        title.textContent = name;

        const subtitle = document.createElement('span');
        subtitle.className =
            'mt-0.5 block truncate text-[11px] font-medium text-slate-500';
        subtitle.textContent = details || 'Location';

        textArea.appendChild(title);
        textArea.appendChild(subtitle);

        option.appendChild(iconCircle);
        option.appendChild(textArea);

        const selectLocation = () => {
            inputElement.value = details
                ? `${name}, ${details}`
                : name;

            inputElement.dataset.lat = String(latitude);
            inputElement.dataset.lon = String(longitude);

            dropdownElement.innerHTML = '';
            dropdownElement.classList.add('hidden');
            inputElement.setAttribute('aria-expanded', 'false');

            const clearButtonId = inputElement.id === 'start-input'
                ? 'start-clear-btn'
                : 'end-clear-btn';

            document.getElementById(clearButtonId)
                .classList.remove('hidden');

            inputElement.focus();
        };

        option.addEventListener('click', selectLocation);

        option.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                selectLocation();
            }
        });

        dropdownElement.appendChild(option);
    });
}

        routingControl.on('routesfound', async function(e) {
            let uniqueRoutes = [];
            let seenDistances = new Set();
            
            (e.routes || []).forEach(r => {
                let distMiles = (r.summary.totalDistance * 0.000621371).toFixed(1);
                if (!seenDistances.has(distMiles)) {
                    seenDistances.add(distMiles);
                    uniqueRoutes.push(r);
                }
            });

            rawRoutesMemoryArray = uniqueRoutes; 
            routeLineCoordinates = uniqueRoutes[0] ? uniqueRoutes[0].coordinates : [];
            currentRouteInstructions = uniqueRoutes[0] ? (uniqueRoutes[0].instructions || []) : [];
            activeInstructionIndex = 0;
            currentTrackedPolylineIndex = 0;
            lastMileageUpdateGps = null;
            continuousOffRouteDriftTicks = 0; 
            
            updateQueueHUD();

            if (isAlternateMatrixModeActive && rawRoutesMemoryArray.length > 1) {
                document.getElementById('route-mileage-sticky').classList.add('hidden');
                renderAlternateRoutePathsMatrix(uniqueRoutes);
                setReadyStatus('Choose a route option by tapping a route label on the map.');
                
                if (lastUserGpsCoord) {
                    const snappedNode = computeSnapToRouteVector(L.latLng(lastUserGpsCoord[0], lastUserGpsCoord[1]));
                    updateAppleNavigationHUD(snappedNode);
                } else {
                    updateAppleNavigationHUD(routeLineCoordinates[0]);
                }
            } else {
                window.selectAndLockPrimaryTrackPath(0, maintainMapViewportOnRouteFound);
            }

            poiClusterGroup.clearLayers();
            allPoiMarkersMemoryMap = [];
            
            const activeCrossedStates = calculateIntersectedStates(routeLineCoordinates);
            updateInlineStatus(`Crossed state borders mapped: [${activeCrossedStates.length} States identified]`, true);
            
           localJsonMemory = [];

setLoadingStatus('Loading locations near your route...');

const statePoiResults = await Promise.all(
    activeCrossedStates.map(async (stateName) => {
        try {
            const response = await fetch(
                `https://raw.githubusercontent.com/kev11wolf/public/main/data/${stateName}_brands.json`,
                { cache: 'no-store' }
            );

            if (!response.ok) {
                showPoiDataWarning(stateName);
                return [];
            }

            const stateData = await response.json();

            if (!Array.isArray(stateData)) {
                console.warn(`Invalid POI JSON format for: ${stateName}`);
                showPoiDataWarning(stateName);
                return [];
            }

            return stateData
                .map(normalizePoi)
                .filter(Boolean);

        } catch (error) {
            console.warn(`Could not load POI data for: ${stateName}`, error);
            showPoiDataWarning(stateName);
            return [];
        }
    })
);

localJsonMemory = statePoiResults.flat();

renderGlobalPermanentStars();

if (localJsonMemory.length === 0) {
    setReadyStatus(
        'No POI data was available for this route. Try again later.'
    );
} else if (currentMasterCat) {
    dispatchOffThreadAnalysis();
} else {
    setReadyStatus(
        'Route ready. Choose a category to see nearby locations.'
    );
}

maintainMapViewportOnRouteFound = false;

        map.on('popupopen', function(e) {
            const containerNode = e.popup.getElement();

            const queueBtn = containerNode.querySelector('.queue-stop-trigger');
            if (queueBtn) {
                queueBtn.addEventListener('click', function() {
                    const lat = parseFloat(this.dataset.lat);
                    const lon = parseFloat(this.dataset.lon);
                    const name = this.dataset.name;

                    if (!stopQueue.some(s => roundCoords(s.lat) === roundCoords(lat) && roundCoords(s.lon) === roundCoords(lon))) {
                        stopQueue.push({ lat, lon, name });
                        triggerToast(`Added stop: "${name}"`);
                        updateQueueHUD();
                        triggerRouteCalculation(true);
                    } else {
                        triggerToast("This location is already inside your target stop queue.");
                    }
                    map.closePopup();
                });
            }

            const starToggle = containerNode.querySelector('.star-toggle-trigger');
            if (starToggle) {
                starToggle.addEventListener('click', function() {
                    const lat = parseFloat(this.dataset.lat);
                    const lon = parseFloat(this.dataset.lon);
                    let localStarred = JSON.parse(localStorage.getItem('starred_pois') || '[]');
                    const matchIndex = localStarred.findIndex(item => roundCoords(item.lat) === roundCoords(lat) && roundCoords(item.lon) === roundCoords(lon));
                    
                    if (matchIndex > -1) {
                        localStarred.splice(matchIndex, 1);
                        triggerToast("Removed from profile stars.");
                    } else {
                        localStarred.push({
                            lat: lat, lon: lon,
                            name: this.dataset.name,
                            category: this.dataset.cat,
                            brand: this.dataset.brand,
                            hours: this.dataset.hours,
                            desc: this.dataset.desc
                        });
                        triggerToast("Location pinned persistently to profile map layer!");
                    }
                    localStorage.setItem('starred_pois', JSON.stringify(localStarred));
                    renderGlobalPermanentStars();
                    map.closePopup();
                });
            }

            const repoDelete = containerNode.querySelector('.global-delete-trigger');
            if (repoDelete) {
                repoDelete.addEventListener('click', function() {
                    const lat = parseFloat(this.dataset.lat);
                    const lon = parseFloat(this.dataset.lon);
                    repoFavoritesMemory = repoFavoritesMemory.filter(r => !(roundCoords(r.lat) === roundCoords(lat) && roundCoords(r.lon) === roundCoords(lon)));
                    
                    let localStarred = JSON.parse(localStorage.getItem('starred_pois') || '[]');
                    localStarred = localStarred.filter(item => !(roundCoords(item.lat) === roundCoords(lat) && roundCoords(item.lon) === roundCoords(lon)));
                    localStorage.setItem('starred_pois', JSON.stringify(localStarred));
                    
                    triggerToast("Dropped location item from repository matrix.");
                    renderGlobalPermanentStars();
                    map.closePopup();
                });
            }
        });
