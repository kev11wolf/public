<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Progress Tracker</title>
<meta name="description" content="Production-ready browser-based Contract Progress Tracker with program/building/contract/activity rollups, rules-of-credit gates, SPI/LPI, and period locking.">
<style>

:root {
  --color-bg: #f4f6f9; --color-surface: #ffffff; --color-border: #dde2e8; --color-text: #1f2733;
  --color-muted: #667085; --color-primary: #1f4e79; --color-primary-dark: #163a5c; --color-accent: #c98a2b;
  --color-good: #1f8a4c; --color-good-bg: #e6f4ea; --color-warn: #b8790a; --color-warn-bg: #fdf1dc;
  --color-bad: #c1352b; --color-bad-bg: #fbe9e7; --radius: 8px;
  --shadow: 0 1px 3px rgba(20, 30, 50, 0.08), 0 1px 2px rgba(20, 30, 50, 0.06);
  font-size: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--color-bg); color: var(--color-text); }
#app-root { min-height: 100vh; display: flex; flex-direction: column; }
.app-header { background: var(--color-primary); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; }
.brand-mark { background: var(--color-accent); color: #1f2733; font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; }
.status-pill { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; }
.app-nav { display: flex; flex-wrap: wrap; gap: 4px; background: var(--color-primary-dark); padding: 6px 16px; }
.nav-btn { background: transparent; border: none; color: rgba(255,255,255,0.8); padding: 10px 14px; border-radius: var(--radius) var(--radius) 0 0; cursor: pointer; font-size: 0.92rem; }
.nav-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
.nav-btn.active { background: var(--color-surface); color: var(--color-primary-dark); font-weight: 600; }
.nav-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
.app-main { flex: 1; padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 12px; color: var(--color-primary-dark); }
h2 { font-size: 1.15rem; margin: 0 0 10px; color: var(--color-primary-dark); }
h3 { font-size: 1rem; margin: 0 0 8px; color: var(--color-primary-dark); }
.muted { color: var(--color-muted); font-size: 0.9rem; }
.warning-text { color: var(--color-warn); font-weight: 600; }
.panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 18px; }
.nested-block { border-left: 3px solid var(--color-accent); padding-left: 12px; margin: 12px 0; }
.controls-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.controls-row label, .inline-form label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--color-muted); gap: 4px; }
.inline-form, .form-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.form-grid label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--color-muted); gap: 4px; }
input, select, button { font-family: inherit; font-size: 0.92rem; padding: 7px 9px; border: 1px solid var(--color-border); border-radius: 6px; background: #fff; color: var(--color-text); }
button { background: var(--color-primary); color: #fff; border: none; cursor: pointer; padding: 8px 14px; font-weight: 500; }
button:hover { background: var(--color-primary-dark); }
button.danger-btn { background: var(--color-bad); }
button.danger-btn:hover { background: #8f271f; }
button.link-btn { background: transparent; color: var(--color-primary); padding: 4px 0; margin-bottom: 10px; text-decoration: underline; }
button.link-btn:hover { background: transparent; color: var(--color-primary-dark); }
.file-label { display: inline-flex; align-items: center; gap: 6px; }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-card { background: var(--color-surface); border: 1px solid var(--color-border); border-left: 4px solid var(--color-primary); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.kpi-card.kpi-good { border-left-color: var(--color-good); background: var(--color-good-bg); }
.kpi-card.kpi-warn { border-left-color: var(--color-warn); background: var(--color-warn-bg); }
.kpi-card.kpi-bad { border-left-color: var(--color-bad); background: var(--color-bad-bg); }
.kpi-label { font-size: 0.78rem; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.kpi-value { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
.table-scroll { overflow-x: auto; max-width: 100%; }

table.data-table th, table.data-table td { border-bottom: 1px solid var(--color-border); padding: 8px 10px; text-align: left; white-space: nowrap; }

table.sticky-header thead th { position: sticky; top: 0; z-index: 1; }
tr.row-building td { font-weight: 600; background: #f7f9fb; }
tr.row-contract td.indent { padding-left: 26px; }
.ratio-good { color: var(--color-good); font-weight: 700; }
.ratio-warn { color: var(--color-warn); font-weight: 700; }
.ratio-bad { color: var(--color-bad); font-weight: 700; }
.ratio-neutral { color: var(--color-muted); }
.tag { display: inline-block; background: #eef2f7; color: var(--color-primary-dark); border-radius: 4px; padding: 1px 6px; font-size: 0.75rem; margin-left: 4px; }
.tag-override { background: var(--color-warn-bg); color: var(--color-warn); }
.exceptions-panel { border-left: 4px solid var(--color-bad); }
.exceptions-panel ul { margin: 0; padding-left: 20px; }
.exceptions-panel li { margin-bottom: 4px; }
.scurve-canvas { width: 100%; height: 260px; display: block; }
.legend { display: flex; gap: 14px; font-size: 0.82rem; margin-bottom: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
table.chart-data-table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
table.chart-data-table th, table.chart-data-table td { border: 1px solid var(--color-border); padding: 4px 8px; text-align: right; white-space: nowrap; }
table.chart-data-table th:first-child, table.chart-data-table td:first-child { text-align: left; }
@media (max-width: 640px) { .app-main { padding: 12px; } .kpi-row { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); } h1 { font-size: 1.25rem; } }

</style>
</head>
<body>
<div id="app-root" role="application" aria-label="Contract Progress Tracker"></div>
<script>

// ===== schema.js =====
const SCHEMA_VERSION = 2;
const CURVE_TYPES = { LINEAR: 'linear', S_CURVE: 's-curve', FRONT_LOADED: 'front-loaded', BACK_LOADED: 'back-loaded' };
const CURVE_LABELS = {
  [CURVE_TYPES.LINEAR]: 'Linear', [CURVE_TYPES.S_CURVE]: 'Standard S-Curve',
  [CURVE_TYPES.FRONT_LOADED]: 'Front-Loaded', [CURVE_TYPES.BACK_LOADED]: 'Back-Loaded',
};
const REPORTING_PERIODS = { WEEKLY: 'weekly', MONTHLY: 'monthly' };
const PERIOD_STATUS = { OPEN: 'open', CLOSED: 'closed' };
const GATE_WEIGHT_TOLERANCE = 0.05;

function uuid() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}
function nowIso() { return new Date().toISOString(); }

function defaultSettings() {
  return {
    schemaVersion: SCHEMA_VERSION,
    settings: {
      adminName: 'Kevin', reportingCurrency: 'USD', locale: 'en-US', timeZone: 'America/New_York',
      reportingPeriod: REPORTING_PERIODS.WEEKLY, statusDate: new Date().toISOString().slice(0, 10),
    },
  };
}
function emptyDataset() {
  const base = defaultSettings();
  return {
    schemaVersion: base.schemaVersion, settings: base.settings,
    programs: [], buildings: [], contracts: [], activities: [], gates: [],
    actualHours: [], auditEvents: [], periods: [], snapshots: [],
  };
}
function makeProgram({ name, description = '' } = {}) {
  return { id: uuid(), name: name || 'New Program', description, createdAt: nowIso(), updatedAt: nowIso() };
}
function makeBuilding({ programId, name, description = '' } = {}) {
  return { id: uuid(), programId, name: name || 'New Building', description, createdAt: nowIso(), updatedAt: nowIso() };
}
function makeContract({
  buildingId, name, contractType = 'General', authorizedBudget = 0, authorizedHours = 0,
  baselineStart = '', baselineFinish = '', forecastStart = '', forecastFinish = '', status = 'Active',
} = {}) {
  return {
    id: uuid(), buildingId, name: name || 'New Contract', contractType,
    authorizedBudget: Number(authorizedBudget) || 0, authorizedHours: Number(authorizedHours) || 0,
    baselineStart, baselineFinish, forecastStart, forecastFinish, status, createdAt: nowIso(), updatedAt: nowIso(),
  };
}
function makeActivity({
  contractId, code = '', name, description = '', budget = 0, plannedHours = 0,
  baselineStart = '', baselineFinish = '', forecastStart = '', forecastFinish = '',
  baselineCurve = CURVE_TYPES.S_CURVE, forecastCurve = CURVE_TYPES.S_CURVE,
} = {}) {
  return {
    id: uuid(), contractId, code, name: name || 'New Activity', description,
    budget: Number(budget) || 0, plannedHours: Number(plannedHours) || 0,
    baselineStart, baselineFinish, forecastStart, forecastFinish, baselineCurve, forecastCurve,
    forecastOverride: null, actualOverride: null, createdAt: nowIso(), updatedAt: nowIso(),
  };
}
function makeGate({ activityId, name, weightPct = 0, completionPct = 0, statusDate = '', notes = '', updatedBy = '', order = 0 } = {}) {
  return {
    id: uuid(), activityId, name: name || 'New Gate', weightPct: Number(weightPct) || 0,
    completionPct: Number(completionPct) || 0, statusDate: statusDate || new Date().toISOString().slice(0, 10),
    notes, updatedBy, updatedAt: nowIso(), order,
  };
}
function makeActualHourRecord({ activityId, date, hours, notes = '', enteredBy = '', periodId = null } = {}) {
  return { id: uuid(), activityId, date, hours: Number(hours) || 0, notes, enteredBy, enteredAt: nowIso(), periodId };
}
function makeAuditEvent({ entityType, entityId, eventType, before = {}, after = {}, reason = '', periodId = null, performedBy = '' } = {}) {
  return { id: uuid(), entityType, entityId, eventType, before, after, reason, periodId, performedBy, timestamp: nowIso() };
}
function makePeriod({ type, startDate, endDate, label, status = PERIOD_STATUS.OPEN } = {}) {
  return { id: uuid(), type, startDate, endDate, label, status, createdAt: nowIso(), closedAt: null, closedBy: null, reopenedHistory: [] };
}
function makeSnapshot({ periodId, kpis, rollups, performedBy }) {
  return { id: uuid(), periodId, kpis, rollups, timestamp: nowIso(), performedBy };
}
function validateGateWeights(gates) {
  const total = gates.reduce((sum, g) => sum + (Number(g.weightPct) || 0), 0);
  const diff = Math.abs(total - 100);
  return { valid: diff <= GATE_WEIGHT_TOLERANCE || gates.length === 0, total, diff };
}
function clampPct(v) {
  const n = Number(v);
  if (Number.isNaN(n)) return 0;
  return Math.min(100, Math.max(0, n));
}
function validateDataset(obj) {
  const errors = [];
  if (!obj || typeof obj !== 'object') { errors.push('File is not a valid JSON object.'); return { valid: false, errors }; }
  if (typeof obj.schemaVersion !== 'number') errors.push('Missing schemaVersion.');
  const requiredArrays = ['programs', 'buildings', 'contracts', 'activities', 'gates', 'actualHours', 'auditEvents', 'periods', 'snapshots'];
  requiredArrays.forEach((k) => { if (!Array.isArray(obj[k])) errors.push('Missing or invalid array: ' + k); });
  if (!obj.settings || typeof obj.settings !== 'object') errors.push('Missing settings object.');
  return { valid: errors.length === 0, errors };
}

// ===== calculations.js =====
function linearCurve(t) { return t; }
function sCurve(t) { return (1 - Math.cos(Math.PI * t)) / 2; }
function frontLoadedCurve(t) { return Math.sqrt(t); }
function backLoadedCurve(t) { return t * t; }
const CURVE_FN = {
  [CURVE_TYPES.LINEAR]: linearCurve, [CURVE_TYPES.S_CURVE]: sCurve,
  [CURVE_TYPES.FRONT_LOADED]: frontLoadedCurve, [CURVE_TYPES.BACK_LOADED]: backLoadedCurve,
};
function curveFraction(curveType, t) {
  const fn = CURVE_FN[curveType] || sCurve;
  const clamped = Math.min(1, Math.max(0, t));
  return fn(clamped);
}
function progressPctAtDate(startDate, finishDate, curveType, asOfDate) {
  if (!startDate || !finishDate) return 0;
  const start = new Date(startDate + 'T00:00:00');
  const finish = new Date(finishDate + 'T23:59:59');
  const asOf = new Date(asOfDate + 'T12:00:00');
  const totalMs = finish - start;
  if (totalMs <= 0) return asOf >= start ? 100 : 0;
  if (asOf <= start) return 0;
  if (asOf >= finish) return 100;
  const t = (asOf - start) / totalMs;
  return clampPct(curveFraction(curveType, t) * 100);
}
function timePhasedSeries(startDate, finishDate, curveType, periodDates) {
  return periodDates.map((d) => ({ date: d, cumulativePct: progressPctAtDate(startDate, finishDate, curveType, d) }));
}
function gateEarnedCredit(gate) {
  const weight = Number(gate.weightPct) || 0;
  const completion = Number(gate.completionPct) || 0;
  return weight * (completion / 100);
}
function activityCalculatedActualPct(gates) {
  const sum = gates.reduce((acc, g) => acc + gateEarnedCredit(g), 0);
  return clampPct(sum);
}
function activityActualPct(activity, gates) {
  if (activity.actualOverride && activity.actualOverride.pct != null) return clampPct(activity.actualOverride.pct);
  return activityCalculatedActualPct(gates);
}
function activityForecastPct(activity, asOfDate) {
  if (activity.forecastOverride && activity.forecastOverride.pct != null) return clampPct(activity.forecastOverride.pct);
  return progressPctAtDate(activity.forecastStart, activity.forecastFinish, activity.forecastCurve, asOfDate);
}
function activityPlannedPct(activity, asOfDate) {
  return progressPctAtDate(activity.baselineStart, activity.baselineFinish, activity.baselineCurve, asOfDate);
}
function sumActualHours(records) { return records.reduce((acc, r) => acc + (Number(r.hours) || 0), 0); }
function ratioOrDash(numerator, denominator) {
  if (!denominator || Math.abs(denominator) < 1e-9) return null;
  return numerator / denominator;
}
function computeSPI(totalEarnedValue, totalPlannedValue) { return ratioOrDash(totalEarnedValue, totalPlannedValue); }
function computeLPI(totalEarnedHours, totalActualHours) { return ratioOrDash(totalEarnedHours, totalActualHours); }
function formatRatio(r) { return r == null ? '—' : r.toFixed(2); }
function ratioStatus(r) {
  if (r == null) return 'neutral';
  if (r >= 1.0) return 'good';
  if (r >= 0.9) return 'warn';
  return 'bad';
}
function rollupTotals(items) {
  const totals = items.reduce(
    (acc, it) => {
      acc.plannedValue += it.plannedValue || 0; acc.forecastValue += it.forecastValue || 0;
      acc.earnedValue += it.earnedValue || 0; acc.earnedHours += it.earnedHours || 0;
      acc.actualHours += it.actualHours || 0; acc.budget += it.budget || 0; acc.plannedHours += it.plannedHours || 0;
      return acc;
    },
    { plannedValue: 0, forecastValue: 0, earnedValue: 0, earnedHours: 0, actualHours: 0, budget: 0, plannedHours: 0 }
  );
  totals.spi = computeSPI(totals.earnedValue, totals.plannedValue);
  totals.lpi = computeLPI(totals.earnedHours, totals.actualHours);
  totals.actualPct = totals.budget ? clampPct((totals.earnedValue / totals.budget) * 100) : 0;
  totals.plannedPct = totals.budget ? clampPct((totals.plannedValue / totals.budget) * 100) : 0;
  totals.forecastPct = totals.budget ? clampPct((totals.forecastValue / totals.budget) * 100) : 0;
  return totals;
}

// ===== periods.js =====
function parseDateLocal(iso) { return new Date(iso + 'T00:00:00'); }
function toIsoLocal(date) { return date.toISOString().slice(0, 10); }
function addDaysLocal(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function weeklyPeriodFor(dateIso) {
  const d = parseDateLocal(dateIso);
  const dow = d.getDay();
  const start = addDaysLocal(d, -dow);
  const end = addDaysLocal(start, 6);
  return { startDate: toIsoLocal(start), endDate: toIsoLocal(end), label: 'Week of ' + toIsoLocal(start) };
}
function monthlyPeriodFor(dateIso) {
  const d = parseDateLocal(dateIso);
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { startDate: toIsoLocal(start), endDate: toIsoLocal(end), label: start.toLocaleString('en-US', { month: 'long', year: 'numeric' }) };
}
function periodBoundsFor(type, dateIso) { return type === REPORTING_PERIODS.MONTHLY ? monthlyPeriodFor(dateIso) : weeklyPeriodFor(dateIso); }
function periodBoundaryDates(startIso, finishIso, type) {
  if (!startIso || !finishIso) return [];
  const dates = [];
  let cursor = periodBoundsFor(type, startIso);
  let guard = 0;
  while (cursor.endDate <= finishIso && guard < 500) {
    dates.push(cursor.endDate);
    const next = addDaysLocal(parseDateLocal(cursor.endDate), 1);
    cursor = periodBoundsFor(type, toIsoLocal(next));
    guard++;
  }
  if (dates.length === 0 || dates[dates.length - 1] < finishIso) dates.push(finishIso);
  return dates;
}
function getOpenPeriod(periods) { return periods.find((p) => p.status === PERIOD_STATUS.OPEN) || null; }
function getOrCreateOpenPeriod(periods, type, statusDate) {
  let open = getOpenPeriod(periods);
  if (open) return open;
  const bounds = periodBoundsFor(type, statusDate);
  const period = makePeriod({ type, startDate: bounds.startDate, endDate: bounds.endDate, label: bounds.label, status: PERIOD_STATUS.OPEN });
  periods.push(period);
  return period;
}
function closePeriodAndAdvance(periods, snapshots, auditEvents, { kpis, rollups, performedBy, type }) {
  const open = getOpenPeriod(periods);
  if (!open) throw new Error('No open period to close.');
  open.status = PERIOD_STATUS.CLOSED; open.closedAt = nowIso(); open.closedBy = performedBy;
  const snapshot = makeSnapshot({ periodId: open.id, kpis, rollups, performedBy });
  snapshots.push(snapshot);
  const closeEvent = makeAuditEvent({
    entityType: 'period', entityId: open.id, eventType: 'period-closed',
    before: { status: PERIOD_STATUS.OPEN }, after: { status: PERIOD_STATUS.CLOSED }, periodId: open.id, performedBy,
  });
  auditEvents.push(closeEvent);
  const nextDayIso = toIsoLocal(addDaysLocal(parseDateLocal(open.endDate), 1));
  const bounds = periodBoundsFor(type, nextDayIso);
  const newPeriod = makePeriod({ type, startDate: bounds.startDate, endDate: bounds.endDate, label: bounds.label, status: PERIOD_STATUS.OPEN });
  periods.push(newPeriod);
  return { closedPeriod: open, snapshot, newPeriod, auditEvents: [closeEvent] };
}
function reopenPeriod(periods, auditEvents, periodId, reason, performedBy) {
  const period = periods.find((p) => p.id === periodId);
  if (!period) throw new Error('Period not found.');
  if (!reason || !reason.trim()) throw new Error('A reason is required to reopen a period.');
  const before = { status: period.status };
  period.status = PERIOD_STATUS.OPEN;
  period.reopenedHistory = period.reopenedHistory || [];
  period.reopenedHistory.push({ reason, by: performedBy, at: nowIso() });
  const event = makeAuditEvent({
    entityType: 'period', entityId: period.id, eventType: 'period-reopened',
    before, after: { status: PERIOD_STATUS.OPEN }, reason, periodId: period.id, performedBy,
  });
  auditEvents.push(event);
  return { period, event };
}
function isDateInPeriod(dateIso, period) { return dateIso >= period.startDate && dateIso <= period.endDate; }
function findPeriodForDate(periods, dateIso) { return periods.find((p) => isDateInPeriod(dateIso, p)) || null; }

// ===== store.js =====
const DB_NAME = 'contract-progress-tracker';
const DB_VERSION = 1;
const STORE_NAME = 'dataset';
const RECORD_KEY = 'main';
const LOCAL_STORAGE_KEY = 'cpt_dataset_v' + SCHEMA_VERSION;
let dbPromise = null;
let indexedDbAvailable = true;
function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { indexedDbAvailable = false; reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => { indexedDbAvailable = false; reject(req.error); };
  });
  return dbPromise;
}
async function loadDataset() {
  try {
    const db = await openDb();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(RECORD_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return loadFromLocalStorage(); }
}
async function saveDataset(dataset) {
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(dataset, RECORD_KEY);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  } catch (e) { saveToLocalStorage(dataset); }
}
function loadFromLocalStorage() {
  try { const raw = localStorage.getItem(LOCAL_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveToLocalStorage(dataset) {
  try { localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dataset)); }
  catch (e) { console.error('Unable to persist dataset to localStorage', e); }
}
async function initDataset() {
  const existing = await loadDataset();
  if (existing) return existing;
  const fresh = emptyDataset();
  await saveDataset(fresh);
  return fresh;
}
function exportDatasetToFile(dataset, filenamePrefix) {
  const filename = (filenamePrefix || 'contract-progress-tracker') + '-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
  const blob = new Blob([JSON.stringify(dataset, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function parseImportedJson(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { valid: false, errors: ['File is not valid JSON: ' + e.message] }; }
  const result = validateDataset(obj);
  return { ...result, dataset: obj };
}
function isIndexedDbAvailable() { return indexedDbAvailable; }

const CHART_COLORS = { planned: '#5b7fb0', forecast: '#c98a2b', actual: '#2f9e5b', grid: '#e2e6ea', axis: '#8a94a3' };
function drawSCurve(canvas, series, opts = {}) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const width = Math.max(rect.width, 300);
  const height = opts.height || 260;
  canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const padding = { top: 16, right: 16, bottom: 32, left: 44 };
  const plotW = width - padding.left - padding.right;
  const plotH = height - padding.top - padding.bottom;
  const maxLen = Math.max(1, ...series.map((s) => s.points.length));
  const maxY = 100;
  ctx.strokeStyle = CHART_COLORS.grid; ctx.fillStyle = CHART_COLORS.axis;
  ctx.font = '11px system-ui, sans-serif'; ctx.lineWidth = 1;
  for (let g = 0; g <= 100; g += 25) {
    const y = padding.top + plotH - (g / maxY) * plotH;
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(padding.left + plotW, y); ctx.stroke();
    ctx.fillText(g + '%', 4, y + 3);
  }
  series.forEach((s) => {
    if (!s.points.length) return;
    ctx.strokeStyle = s.color || CHART_COLORS[s.key] || '#333';
    ctx.lineWidth = 2; ctx.beginPath();
    s.points.forEach((p, i) => {
      const x = padding.left + (i / Math.max(1, maxLen - 1)) * plotW;
      const y = padding.top + plotH - (p.y / maxY) * plotH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
  const labelSeries = series.find((s) => s.points.length) || { points: [] };
  const idxs = [0, Math.floor((labelSeries.points.length - 1) / 2), labelSeries.points.length - 1].filter((v, i, a) => a.indexOf(v) === i && v >= 0);
  ctx.fillStyle = CHART_COLORS.axis;
  idxs.forEach((i) => {
    const p = labelSeries.points[i];
    if (!p) return;
    const x = padding.left + (i / Math.max(1, maxLen - 1)) * plotW;
    ctx.fillText(p.label || '', Math.max(padding.left, x - 20), height - 8);
  });
}
function buildLegendHtml(series) {
  return series.map((s) => '<span class="legend-item"><span class="legend-swatch" style="background:' + (s.color || CHART_COLORS[s.key]) + '"></span>' + s.name + '</span>').join('');
}
function renderChartDataTable(container, series, dateLabels) {
  container.innerHTML = '';
  const table = document.createElement('table');
  table.className = 'chart-data-table';
  table.setAttribute('aria-label', 'Time-phased progress data table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const thDate = document.createElement('th'); thDate.textContent = 'Period'; headRow.appendChild(thDate);
  series.forEach((s) => { const th = document.createElement('th'); th.textContent = s.name; headRow.appendChild(th); });
  thead.appendChild(headRow); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  dateLabels.forEach((label, i) => {
    const row = document.createElement('tr');
    const tdLabel = document.createElement('td'); tdLabel.textContent = label; row.appendChild(tdLabel);
    series.forEach((s) => {
      const td = document.createElement('td');
      const pt = s.points[i];
      td.textContent = pt ? pt.y.toFixed(1) + '%' : '—';
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  container.appendChild(table);
}

function isoDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function isoDaysFromNow(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

function createApp(root, initialDataset) {
  const state = { ds: initialDataset, tab: 'dashboard', selection: {} };
  function fmtMoney(v) {
    try {
      return new Intl.NumberFormat(state.ds.settings.locale || 'en-US', {
        style: 'currency', currency: state.ds.settings.reportingCurrency || 'USD', maximumFractionDigits: 0,
      }).format(v || 0);
    } catch (e) { return '$' + Math.round(v || 0).toLocaleString(); }
  }
  function fmtHours(v) { return (v || 0).toLocaleString(state.ds.settings.locale || 'en-US', { maximumFractionDigits: 1 }); }
  function fmtPct(v) { return (v || 0).toFixed(1) + '%'; }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function admin() { return state.ds.settings.adminName || 'Admin'; }
  function asOfDate() { return state.ds.settings.statusDate; }
  async function persist() { await saveDataset(state.ds); }
  function audit(entityType, entityId, eventType, before, after, reason) {
    state.ds.auditEvents.push(makeAuditEvent({ entityType, entityId, eventType, before, after, reason, periodId: currentOpenPeriodId(), performedBy: admin() }));
  }
  function currentOpenPeriodId() { const p = getOpenPeriod(state.ds.periods); return p ? p.id : null; }
  function ensureOpenPeriod() { return getOrCreateOpenPeriod(state.ds.periods, state.ds.settings.reportingPeriod, state.ds.settings.statusDate); }
  function gatesForActivity(activityId) { return state.ds.gates.filter((g) => g.activityId === activityId).sort((a, b) => (a.order || 0) - (b.order || 0)); }
  function hoursForActivity(activityId) { return state.ds.actualHours.filter((h) => h.activityId === activityId); }
  function activitiesForContract(contractId) { return state.ds.activities.filter((a) => a.contractId === contractId); }
  function contractsForBuilding(buildingId) { return state.ds.contracts.filter((c) => c.buildingId === buildingId); }
  function buildingsForProgram(programId) { return state.ds.buildings.filter((b) => b.programId === programId); }
  function activityMetrics(activity) {
    const gates = gatesForActivity(activity.id);
    const hours = hoursForActivity(activity.id);
    const plannedPct = activityPlannedPct(activity, asOfDate());
    const forecastPct = activityForecastPct(activity, asOfDate());
    const calcActualPct = activityCalculatedActualPct(gates);
    const actualPct = activityActualPct(activity, gates);
    const pv = activity.budget * (plannedPct / 100);
    const fv = activity.budget * (forecastPct / 100);
    const ev = activity.budget * (actualPct / 100);
    const eh = activity.plannedHours * (actualPct / 100);
    const ah = sumActualHours(hours);
    const spi = computeSPI(ev, pv);
    const lpi = computeLPI(eh, ah);
    return {
      plannedPct, forecastPct, actualPct, calcActualPct,
      plannedValue: pv, forecastValue: fv, earnedValue: ev, earnedHours: eh, actualHours: ah,
      budget: activity.budget, plannedHours: activity.plannedHours, spi, lpi,
      gateWeightCheck: validateGateWeights(gates),
    };
  }
  function contractMetrics(contract) { return rollupTotals(activitiesForContract(contract.id).map(activityMetrics)); }
  function buildingMetrics(building) { return rollupTotals(contractsForBuilding(building.id).map(contractMetrics)); }
  function programMetrics(program) { return rollupTotals(buildingsForProgram(program.id).map(buildingMetrics)); }
  const TABS = [
    { id: 'dashboard', label: 'Dashboard' }, { id: 'structure', label: 'Program Structure' },
    { id: 'activities', label: 'Activities' }, { id: 'hours', label: 'Hours' },
    { id: 'periods', label: 'Reporting Periods' }, { id: 'settings', label: 'Settings / Data' },
  ];
  function renderShell() {
    root.innerHTML = '';
    const header = document.createElement('header');
    header.className = 'app-header';
    header.innerHTML =
      '<div class="brand"><span class="brand-mark">CPT</span><span class="brand-name">Contract Progress Tracker</span></div>' +
      '<div class="header-meta"><span class="status-pill" id="open-period-pill"></span></div>';
    root.appendChild(header);
    const nav = document.createElement('nav');
    nav.className = 'app-nav';
    nav.setAttribute('role', 'tablist');
    TABS.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (state.tab === t.id ? ' active' : '');
      btn.textContent = t.label;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', state.tab === t.id ? 'true' : 'false');
      btn.addEventListener('click', () => { state.tab = t.id; render(); });
      nav.appendChild(btn);
    });
    root.appendChild(nav);
    const main = document.createElement('main');
    main.className = 'app-main'; main.id = 'app-main';
    root.appendChild(main);
    const openPill = header.querySelector('#open-period-pill');
    const open = getOpenPeriod(state.ds.periods);
    openPill.textContent = open ? 'Open period: ' + open.label + ' (' + open.startDate + ' to ' + open.endDate + ')' : 'No open period';
  }
  function mainEl() { return document.getElementById('app-main'); }
  function render() {
    renderShell();
    const main = mainEl();
    if (state.tab === 'dashboard') renderDashboard(main);
    else if (state.tab === 'structure') renderStructure(main);
    else if (state.tab === 'activities') renderActivities(main);
    else if (state.tab === 'activityDetail') renderActivityDetail(main);
    else if (state.tab === 'hours') renderHours(main);
    else if (state.tab === 'periods') renderPeriods(main);
    else if (state.tab === 'settings') renderSettings(main);

  function kpiCard(label, value, statusClass) {
    const div = document.createElement('div');

  }
  function renderDashboard(main) {
    ensureOpenPeriod();
    const program = state.ds.programs[0];
    main.innerHTML = '';
    const controls = document.createElement('div');
    controls.className = 'panel controls-row';
    controls.innerHTML =
      '<label>Status date <input type="date" id="status-date" value="' + esc(asOfDate()) + '"></label>' +
      '<label>Reporting period <select id="period-toggle">' +
      '<option value="weekly"' + (state.ds.settings.reportingPeriod === 'weekly' ? ' selected' : '') + '>Weekly</option>' +
      '<option value="monthly"' + (state.ds.settings.reportingPeriod === 'monthly' ? ' selected' : '') + '>Monthly</option></select></label>' +

    main.appendChild(controls);

    if (state.selection.programId) progSelect.value = state.selection.programId;
    const activeProgram = state.ds.programs.find((p) => p.id === progSelect.value) || program;
    controls.querySelector('#status-date').addEventListener('change', (e) => { state.ds.settings.statusDate = e.target.value; persist().then(render); });
    controls.querySelector('#period-toggle').addEventListener('change', (e) => { state.ds.settings.reportingPeriod = e.target.value; persist().then(render); });
    progSelect.addEventListener('change', (e) => { state.selection.programId = e.target.value; render(); });
    if (!activeProgram) {
      const empty = document.createElement('div');
      empty.className = 'panel';
      empty.innerHTML = '<p>No program exists yet. Go to <strong>Program Structure</strong> to create one, or load sample data from <strong>Settings / Data</strong>.</p>';
      main.appendChild(empty);
      return;
    }
    const metrics = programMetrics(activeProgram);
    const kpiRow = document.createElement('div');
    kpiRow.className = 'kpi-row';
    kpiRow.appendChild(kpiCard('Budget', fmtMoney(metrics.budget)));
    kpiRow.appendChild(kpiCard('Planned %', fmtPct(metrics.plannedPct)));
    kpiRow.appendChild(kpiCard('Forecast %', fmtPct(metrics.forecastPct)));
    kpiRow.appendChild(kpiCard('Actual %', fmtPct(metrics.actualPct)));
    kpiRow.appendChild(kpiCard('Variance (Actual-Planned)', fmtPct(metrics.actualPct - metrics.plannedPct), (metrics.actualPct - metrics.plannedPct) >= 0 ? 'good' : 'bad'));
    kpiRow.appendChild(kpiCard('Cumulative SPI', formatRatio(metrics.spi), ratioStatus(metrics.spi)));
    kpiRow.appendChild(kpiCard('Cumulative LPI', formatRatio(metrics.lpi), ratioStatus(metrics.lpi)));
    main.appendChild(kpiRow);
    const chartPanel = document.createElement('div');
    chartPanel.className = 'panel';
    chartPanel.innerHTML = '<h2>Program S-Curve (' + esc(activeProgram.name) + ')</h2><div class="legend" id="chart-legend"></div><canvas id="scurve-canvas" class="scurve-canvas" role="img" aria-label="Planned, forecast and actual progress curve"></canvas>';
    main.appendChild(chartPanel);
    const dataTableWrap = document.createElement('div');
    dataTableWrap.className = 'panel';
    dataTableWrap.innerHTML = '<h3>Chart data table (accessible alternative)</h3><div id="chart-table" class="table-scroll"></div>';
    main.appendChild(dataTableWrap);
    renderProgramSCurve(activeProgram);
    const buildingsList = buildingsForProgram(activeProgram.id);
    const drill = document.createElement('div');
    drill.className = 'panel';
    drill.innerHTML = '<h2>Building / Contract Drill-Down</h2>';
    const table = document.createElement('table');
    table.className = 'data-table';
    table.innerHTML = '<thead><tr><th>Building / Contract</th><th>Budget</th><th>Planned %</th><th>Forecast %</th><th>Actual %</th><th>SPI</th><th>LPI</th></tr></thead>';
    const tbody = document.createElement('tbody');
    buildingsList.forEach((b) => {
      const bm = buildingMetrics(b);
      const bRow = document.createElement('tr');
      bRow.className = 'row-building';

        const cRow = document.createElement('tr');

          '<td class="ratio-' + ratioStatus(cm.spi) + '">' + esc(formatRatio(cm.spi)) + '</td>' +

    const exceptions = [];

      if (m.spi != null && m.spi < 0.9) exceptions.push(a.code + ' ' + a.name + ': SPI ' + formatRatio(m.spi) + ' — behind plan.');
      if (m.lpi != null && m.lpi < 0.9) exceptions.push(a.code + ' ' + a.name + ': LPI ' + formatRatio(m.lpi) + ' — unfavorable productivity.');
    });
    if (exceptions.length) {

      excPanel.className = 'panel exceptions-panel';
      excPanel.innerHTML = '<h2>Attention Needed</h2>';

  function renderProgramSCurve(program) {
    const acts = state.ds.activities.filter((a) => {
      const contract = state.ds.contracts.find((c) => c.id === a.contractId);
      const building = contract ? state.ds.buildings.find((b) => b.id === contract.buildingId) : null;
      return building && building.programId === program.id;
    });
    if (!acts.length) return;
    const starts = acts.map((a) => a.baselineStart).filter(Boolean).sort();
    const finishes = acts.map((a) => a.baselineFinish).filter(Boolean).sort();
    const fFinishes = acts.map((a) => a.forecastFinish).filter(Boolean).sort();
    if (!starts.length || !finishes.length) return;
    const overallStart = starts[0];
    const overallFinish = finishes[finishes.length - 1] > (fFinishes[fFinishes.length - 1] || '') ? finishes[finishes.length - 1] : fFinishes[fFinishes.length - 1];
    const boundaries = periodBoundaryDates(overallStart, overallFinish, state.ds.settings.reportingPeriod);
    function seriesFor(kind) {
      return boundaries.map((d) => {
        let sum = 0;
        acts.forEach((a) => {
          if (kind === 'planned') sum += a.budget * (progressPctAtDate(a.baselineStart, a.baselineFinish, a.baselineCurve, d) / 100);
          else if (kind === 'forecast') sum += a.budget * (activityForecastPct(a, d) / 100);
          else {
            const gates = gatesForActivity(a.id);
            const actPct = d <= asOfDate() ? activityActualPct(a, gates) : null;
            if (actPct != null && d <= asOfDate()) sum += a.budget * (actPct / 100);
          }
        });
        const totalBudget = acts.reduce((s, a) => s + a.budget, 0) || 1;
        return { date: d, y: (sum / totalBudget) * 100 };
      });
    }
    const plannedSeries = seriesFor('planned');
    const forecastSeries = seriesFor('forecast');
    const actualSeries = seriesFor('actual').filter((p) => p.date <= asOfDate());
    const series = [
      { key: 'planned', name: 'Planned', color: '#5b7fb0', points: plannedSeries.map((p) => ({ x: p.date, y: p.y, label: p.date })) },
      { key: 'forecast', name: 'Forecast', color: '#c98a2b', points: forecastSeries.map((p) => ({ x: p.date, y: p.y, label: p.date })) },
      { key: 'actual', name: 'Actual', color: '#2f9e5b', points: actualSeries.map((p) => ({ x: p.date, y: p.y, label: p.date })) },
    ];
    const canvas = document.getElementById('scurve-canvas');
    if (canvas) drawSCurve(canvas, series);
    const legend = document.getElementById('chart-legend');
    if (legend) legend.innerHTML = buildLegendHtml(series);
    const tableContainer = document.getElementById('chart-table');

    const sel = panel.querySelector('select[name="activityId"]');
    state.ds.activities.forEach((a) => { const opt = document.createElement('option'); opt.value = a.id; opt.textContent = a.code + ' — ' + a.name; sel.appendChild(opt); });
    panel.querySelector('#hours-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const dateVal = fd.get('date');
      if (open && !isDateInPeriod(dateVal, open)) {
        alert('Date is outside the currently open reporting period (' + open.startDate + ' to ' + open.endDate + '). Actual-hour entries must fall in the open period.');
        return;
      }
      const rec = makeActualHourRecord({ activityId: fd.get('activityId'), date: dateVal, hours: fd.get('hours'), notes: fd.get('notes'), enteredBy: admin(), periodId: open ? open.id : null });
      state.ds.actualHours.push(rec);
      audit('actualHours', rec.id, 'actual-hours-entered', {}, rec);
      persist().then(render);
    });
    const historyPanel = document.createElement('div');
    historyPanel.className = 'panel';
    historyPanel.innerHTML = '<h2>Actual Hour Records</h2>';
    const table = document.createElement('table');
    table.className = 'data-table sticky-header';
    table.innerHTML = '<thead><tr><th>Date</th><th>Activity</th><th>Hours</th><th>Notes</th><th>Entered By</th><th>Period</th></tr></thead>';
    const tbody = document.createElement('tbody');
    state.ds.actualHours.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).forEach((r) => {
      const a = state.ds.activities.find((x) => x.id === r.activityId);
      const period = state.ds.periods.find((p) => p.id === r.periodId);
      const row = document.createElement('tr');
      row.innerHTML =
        '<td>' + esc(r.date) + '</td><td>' + esc(a ? a.code + ' ' + a.name : '') + '</td><td>' + esc(fmtHours(r.hours)) + '</td>' +
        '<td>' + esc(r.notes) + '</td><td>' + esc(r.enteredBy) + '</td><td>' + esc(period ? period.label + ' (' + period.status + ')' : '—') + '</td>';
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    const scroll = document.createElement('div'); scroll.className = 'table-scroll'; scroll.appendChild(table);
    historyPanel.appendChild(scroll); main.appendChild(historyPanel);
  }
  function renderPeriods(main) {
    main.innerHTML = '<h1>Reporting Periods</h1>';
    const open = getOpenPeriod(state.ds.periods);
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = open
      ? '<h2>Open Period</h2><p><strong>' + esc(open.label) + '</strong> (' + esc(open.startDate) + ' to ' + esc(open.endDate) + ')</p><button id="close-period-btn">Close Period &amp; Advance</button>'
      : '<h2>No Open Period</h2><button id="start-period-btn">Start Period</button>';
    main.appendChild(panel);
    const startBtn = panel.querySelector('#start-period-btn');
    if (startBtn) startBtn.addEventListener('click', () => { ensureOpenPeriod(); persist().then(render); });
    const closeBtn = panel.querySelector('#close-period-btn');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        const program = state.ds.programs[0];
        const kpis = program ? programMetrics(program) : {};
        const rollups = {
          programs: state.ds.programs.map((p) => ({ id: p.id, metrics: programMetrics(p) })),
          buildings: state.ds.buildings.map((b) => ({ id: b.id, metrics: buildingMetrics(b) })),
          contracts: state.ds.contracts.map((c) => ({ id: c.id, metrics: contractMetrics(c) })),
          activities: state.ds.activities.map((a) => ({ id: a.id, metrics: activityMetrics(a) })),
        };
        closePeriodAndAdvance(state.ds.periods, state.ds.snapshots, state.ds.auditEvents, { kpis, rollups, performedBy: admin(), type: state.ds.settings.reportingPeriod });
        persist().then(render);
      });
    }
    const closedPanel = document.createElement('div');
    closedPanel.className = 'panel';
    closedPanel.innerHTML = '<h2>Closed Periods</h2>';
    const table = document.createElement('table');
    table.className = 'data-table';
    table.innerHTML = '<thead><tr><th>Period</th><th>Dates</th><th>Status</th><th>Closed By</th><th>Closed At</th><th></th></tr></thead>';
    const tbody = document.createElement('tbody');
    state.ds.periods.filter((p) => p.status === PERIOD_STATUS.CLOSED).sort((a, b) => (a.startDate < b.startDate ? 1 : -1)).forEach((p) => {
      const row = document.createElement('tr');
      row.innerHTML =
        '<td>' + esc(p.label) + '</td><td>' + esc(p.startDate) + ' → ' + esc(p.endDate) + '</td><td>' + esc(p.status) +
        '</td><td>' + esc(p.closedBy) + '</td><td>' + esc(p.closedAt) + '</td><td><button data-reopen>Reopen</button></td>';
      row.querySelector('[data-reopen]').addEventListener('click', () => {
        const reason = prompt('Enter a mandatory reason to reopen "' + p.label + '":');
        if (!reason || !reason.trim()) { alert('Reopen cancelled — a reason is required.'); return; }
        try { reopenPeriod(state.ds.periods, state.ds.auditEvents, p.id, reason, admin()); persist().then(render); }
        catch (err) { alert(err.message); }
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    closedPanel.appendChild(table); main.appendChild(closedPanel);
    const snapPanel = document.createElement('div');
    snapPanel.className = 'panel';
    snapPanel.innerHTML = '<h2>Snapshots</h2>';
    const sTable = document.createElement('table');
    sTable.className = 'data-table';
    sTable.innerHTML = '<thead><tr><th>Snapshot</th><th>Planned Value</th><th>Earned Value</th><th>SPI (cum)</th><th>Earned Hrs</th><th>Actual Hrs</th><th>LPI (cum)</th><th>By</th><th>At</th></tr></thead>';
    const sTbody = document.createElement('tbody');
    state.ds.snapshots.slice().sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1)).forEach((s) => {
      const period = state.ds.periods.find((p) => p.id === s.periodId);
      const k = s.kpis || {};
      const row = document.createElement('tr');
      row.innerHTML =
        '<td>' + esc(period ? period.label : s.periodId) + '</td><td>' + esc(fmtMoney(k.plannedValue)) + '</td><td>' + esc(fmtMoney(k.earnedValue)) +
        '</td><td class="ratio-' + ratioStatus(k.spi) + '">' + esc(formatRatio(k.spi)) + '</td><td>' + esc(fmtHours(k.earnedHours)) +
        '</td><td>' + esc(fmtHours(k.actualHours)) + '</td><td class="ratio-' + ratioStatus(k.lpi) + '">' + esc(formatRatio(k.lpi)) +
        '</td><td>' + esc(s.performedBy) + '</td><td>' + esc(s.timestamp) + '</td>';
      sTbody.appendChild(row);
    });
    sTable.appendChild(sTbody);
    snapPanel.appendChild(sTable); main.appendChild(snapPanel);
  }
  function renderSettings(main) {
    main.innerHTML = '<h1>Settings / Data Manager</h1>';
    const settingsPanel = document.createElement('div');
    settingsPanel.className = 'panel';
    settingsPanel.innerHTML =
      '<h2>Global Settings</h2><form id="settings-form" class="form-grid">' +
      '<label>Administrator name<input name="adminName" value="' + esc(state.ds.settings.adminName) + '"></label>' +
      '<label>Reporting currency (ISO code)<input name="reportingCurrency" value="' + esc(state.ds.settings.reportingCurrency) + '" maxlength="3"></label>' +
      '<label>Locale<input name="locale" value="' + esc(state.ds.settings.locale) + '"></label>' +
      '<label>Time zone<input name="timeZone" value="' + esc(state.ds.settings.timeZone) + '"></label>' +
      '<label>Default reporting period<select name="reportingPeriod">' +
      '<option value="weekly"' + (state.ds.settings.reportingPeriod === 'weekly' ? ' selected' : '') + '>Weekly</option>' +
      '<option value="monthly"' + (state.ds.settings.reportingPeriod === 'monthly' ? ' selected' : '') + '>Monthly</option></select></label>' +
      '<button type="submit">Save Settings</button></form>';
    main.appendChild(settingsPanel);
    settingsPanel.querySelector('#settings-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const before = { ...state.ds.settings };
      state.ds.settings.adminName = fd.get('adminName') || 'Admin';
      state.ds.settings.reportingCurrency = (fd.get('reportingCurrency') || 'USD').toUpperCase();
      state.ds.settings.locale = fd.get('locale') || 'en-US';
      state.ds.settings.timeZone = fd.get('timeZone') || 'America/New_York';
      state.ds.settings.reportingPeriod = fd.get('reportingPeriod');
      audit('settings', 'global', 'settings-updated', before, { ...state.ds.settings });
      persist().then(render);
    });
    const dataPanel = document.createElement('div');
    dataPanel.className = 'panel';
    dataPanel.innerHTML =
      '<h2>JSON Import / Export</h2>' +
      '<p class="muted">JSON export/import is the authoritative portable backup and data-transfer method for this tool.</p>' +
      '<button id="export-btn">Export JSON Backup</button> ' +
      '<label class="file-label">Import JSON<input type="file" id="import-file" accept="application/json"></label> ' +
      '<button id="load-sample-btn">Load Sample Data</button> ' +
      '<button id="reset-btn" class="danger-btn">Reset All Data</button>' +
      '<div id="import-status" class="muted"></div>';
    main.appendChild(dataPanel);
    dataPanel.querySelector('#export-btn').addEventListener('click', () => { exportDatasetToFile(state.ds, 'contract-progress-tracker'); });
    dataPanel.querySelector('#import-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!confirm('Importing will replace all current data. Export a backup first if you have not already. Continue?')) { e.target.value = ''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        const result = parseImportedJson(reader.result);
        const statusEl = dataPanel.querySelector('#import-status');
        if (!result.valid) { statusEl.textContent = 'Import failed: ' + result.errors.join(' '); statusEl.className = 'warning-text'; return; }
        state.ds = result.dataset;
        audit('dataset', 'main', 'dataset-imported', {}, {});
        persist().then(() => { statusEl.textContent = 'Import successful.'; statusEl.className = 'muted'; render(); });
      };
      reader.readAsText(file);
    });
    dataPanel.querySelector('#load-sample-btn').addEventListener('click', () => {
      if (!confirm('This will replace current data with sample data. Export a backup first if needed. Continue?')) return;
      state.ds = buildSampleDataset();
      state.ds.settings.adminName = state.ds.settings.adminName || 'Kevin';
      persist().then(render);
    });
    dataPanel.querySelector('#reset-btn').addEventListener('click', () => {
      if (!confirm('This permanently clears all data (after exporting a backup is recommended). Continue?')) return;
      state.ds = emptyDataset();
      persist().then(render);
    });
    const aboutPanel = document.createElement('div');
    aboutPanel.className = 'panel';
    aboutPanel.innerHTML =
      '<h2>About</h2><p class="muted">Single-user local administrator mode. Storage: IndexedDB (with localStorage fallback). ' +
      'A future backend (e.g. Supabase/Postgres) may add authentication, multi-user collaboration, roles, files, and centralized audit control.</p>';
    main.appendChild(aboutPanel);
  }
  render();
  return { getState: () => state, render };
}
// ===== app bootstrap =====
document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('app-root');
  const dataset = await initDataset();
  window.__cpt = createApp(root, dataset);
});

</script>
</body>
