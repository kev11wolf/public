<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12304a">
  <title>Contract Progress Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div><h1>Contract Progress Tracker</h1><p>Plan, forecast, actuals, budgets, and earned progress in one portable file.</p></div>
  <div class="header-actions"><button id="newBtn" class="secondary">New dataset</button><button id="importBtn" class="secondary">Import JSON</button><button id="exportBtn">Export JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
</header>
<main>
  <nav class="tabs" aria-label="Application sections">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="structure">Structure</button>
    <button class="tab" data-view="activities">Activities</button>
    <button class="tab" data-view="updates">Progress updates</button>
    <button class="tab" data-view="data">Data manager</button>
  </nav>
  <section id="dashboard" class="view active"></section>
  <section id="structure" class="view"></section>
  <section id="activities" class="view"></section>
  <section id="updates" class="view"></section>
  <section id="data" class="view"></section>
</main>
<dialog id="modal"><form method="dialog" id="modalForm"><header><h2 id="modalTitle"></h2><button value="cancel" class="icon" aria-label="Close">×</button></header><div id="modalBody"></div><footer><button value="cancel" class="secondary">Cancel</button><button id="saveModal" value="default">Save</button></footer></form></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
